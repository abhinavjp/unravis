  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homestretch covers prototype</title>
  <style>

:root{color-scheme:light dark;--bar:48px;
  --font-body:var(--font-ui);--fs:calc(var(--fs-base) + var(--fs-adj));
  --fs-xs:max(12px,calc(var(--fs) - 2px));--fs-sm:max(12px,calc(var(--fs) - 1px));--fs-md:var(--fs);--fs-lg:calc(var(--fs) + 2px);--fs-xxl:calc(var(--fs) + 6px);
  --row-py:calc(var(--py) * var(--py-scale));--row-py-lg:calc(var(--py-lg) * var(--py-scale));--row-py-sm:calc(var(--py-sm) * var(--py-scale));
  --ctl:color-mix(in srgb,var(--text-2) 72%,var(--bg));
  --focus:var(--run)}

[data-palette=safe]{--ok:light-dark(#00785A,#2BC49A);--ok-bg:light-dark(#E4F4EE,#0F2A23);--bad:light-dark(#B84A00,#F28B3C);--bad-bg:light-dark(#FCF1E8,#33200F);--run:light-dark(#0072B2,#56B4E9);--run-bg:light-dark(#E8F3FA,#102839);--warn:light-dark(#8A5F00,#E69F00);--warn-bg:light-dark(#F9F0DA,#2E230A);--pending:light-dark(#5B6470,#9BA3AE);--pending-bg:light-dark(#ECEEF0,#23282E)}
[data-font=system]{--font-ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;--font-mono:"Cascadia Mono",ui-monospace,Menlo,Consolas,monospace;--font-head:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif}
[data-density=compact]{--fs-adj:0px;--py:7px;--py-lg:14px;--py-sm:4px;--ctl-h:32px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:var(--fs-md)/1.45 var(--font-body);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button,select,input{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--font-head);font-weight:600;letter-spacing:-.005em}
.mono{font-family:var(--font-mono);font-size:.92em}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:var(--fs-md);white-space:nowrap;margin-right:6px;text-decoration:none}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--pending)}
.dot.passed{background:var(--ok)}.dot.failed{background:var(--bad)}.dot.running{background:var(--run)}.dot.waiting{background:var(--warn)}
.tabs{display:flex;gap:2px;height:100%;margin-left:6px}
.tab{display:flex;align-items:center;gap:7px;padding:0 11px;color:var(--text-2);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.st{display:inline-flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-box)}

body { overflow-wrap: anywhere; }
[hidden] { display: none !important; }
.bar {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: var(--bar);
  padding-inline: max(16px, calc((100% - 1000px) / 2));
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.brand { padding-block: 8px; }
.tabs { height: auto; align-self: stretch; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; cursor: pointer; min-height: var(--bar); }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--text); }
.tab:focus-visible { outline-offset: -4px; }
main { max-width: 1032px; margin: auto; padding: 26px 16px 0; }
h1 { font-size: var(--fs-xxl); line-height: 1.3; }
h2 { font-size: var(--fs-lg); }
p { margin: 0; }
.switcher {
  display: flex;
  flex-wrap: wrap;
  width: fit-content;
  gap: 4px 8px;
  align-items: center;
  margin-bottom: 20px;
  padding: 4px 8px;
  border: 1px dashed var(--ctl);
  border-radius: var(--r-ctl);
  color: var(--text-2);
  font-size: var(--fs-xs);
}
.switcher label { font-weight: 500; }
.switcher select {
  min-height: 24px;
  max-width: 100%;
  padding: 0 8px;
  border: 1px solid var(--ctl);
  border-radius: var(--r-ctl);
  background: var(--surface);
  color: var(--text);
}
.view-heading { margin-bottom: 10px; }
.queue-list, .merge-list, .results { list-style: none; margin: 0; padding: 0; }
.queue-row {
  display: grid;
  grid-template-columns: 96px minmax(0, 1fr) minmax(0, 1.15fr) max-content;
  align-items: start;
  gap: 4px 14px;
  padding: var(--row-py-lg) 14px;
  border-bottom: 1px solid var(--line);
}
.queue-list > li:last-child { border-bottom: 0; }
.queue-row.featured {
  background: var(--run-bg);
  box-shadow: inset 3px 0 var(--run);
}
.queue-list > li:first-child { border-start-start-radius: var(--r-box); border-start-end-radius: var(--r-box); }
.queue-list > li:last-child { border-end-start-radius: var(--r-box); border-end-end-radius: var(--r-box); }
.job { font-weight: 600; }
.meta, .detail, .row-time, footer { color: var(--text-2); font-size: var(--fs-sm); }
.meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.row-time { text-align: right; }
.row-covers { grid-column: 2 / -1; min-width: 0; margin-top: 6px; }
.cover-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.chip {
  width: fit-content;
  border-radius: var(--r-chip);
  padding: 2px 7px;
  background: var(--surface-2);
  color: var(--text);
  font-size: var(--fs-xs);
  font-weight: 600;
}
.bar .chip { margin-left: auto; }
.history { margin-top: 24px; }
.queue-history h2 { margin-bottom: 8px; }
.disclosure {
  display: inline-flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 2px 8px;
  padding: 3px 0;
  border: 0;
  background: none;
  color: var(--text);
  font-weight: 600;
  cursor: pointer;
}
.disclosure::before {
  content: "";
  width: .45em;
  height: .45em;
  align-self: center;
  border: solid currentColor;
  border-width: 0 2px 2px 0;
  transform: rotate(-45deg);
}
.disclosure[aria-expanded="true"]::before { transform: rotate(45deg); }
.disclosure-action, .run-back { text-decoration: underline; text-underline-offset: 3px; }
.run-back { display: inline-block; margin-bottom: 8px; color: var(--text-2); font-size: var(--fs-sm); }
.failure-next, .run-note { margin-top: 6px; }
.inert-action {
  margin-top: 6px;
  padding: 3px 8px;
  border: 1px solid var(--ctl);
  border-radius: var(--r-ctl);
  background: var(--surface);
}
.history .disclosure { margin-top: 8px; }
.history .queue-list + .queue-list { border-top: 1px solid var(--line); }
.merge-list { margin-top: 6px; }
.merge-list li {
  display: grid;
  grid-template-columns: minmax(5ch, max-content) minmax(0, 1fr) auto;
  gap: 4px 10px;
  padding: var(--row-py-sm) 0;
}
.merge-list code { color: var(--text-2); }
.pr-number { min-width: 5ch; white-space: nowrap; }
.run-head { padding: var(--row-py-lg) 14px; }
.run-head .meta { margin-top: 4px; }
.run-cover { margin-top: 12px; padding-top: 6px; border-top: 1px solid var(--line); }
.run-cover p { margin-top: 8px; }
.result-panel { margin-top: 16px; padding: var(--row-py-lg) 14px; }
.results { margin-top: 6px; }
.results li {
  display: grid;
  grid-template-columns: minmax(5ch, max-content) minmax(0, 1fr);
  gap: 10px;
  align-items: baseline;
  padding: var(--row-py-sm) 0;
}
.results li + li { border-top: 1px solid var(--line); }
.results .message { display: flex; align-items: baseline; gap: 7px; }
.message .dot { align-self: start; margin-top: .48em; }
footer { margin: 24px 0; padding: 12px 0 0; border-top: 1px solid var(--line); }

@media (max-width: 640px) {
  main { padding-top: 18px; }
  .queue-row { grid-template-columns: 76px minmax(0, 1fr); gap: 4px 8px; padding: var(--row-py) 10px; }
  .queue-row .detail, .row-time, .row-covers { grid-column: 2; }
  .row-time { text-align: left; }
  .merge-list li { grid-template-columns: minmax(5ch, max-content) minmax(0, 1fr); }
  .merge-list code { grid-column: 2; }
}
@media (max-width: 420px) {
  .bar { flex-wrap: wrap; }
  .tabs { margin-left: 0; order: 1; width: 100%; }
  .tab { min-height: 40px; }
  .row-covers { grid-column: 1 / -1; padding-left: 3px; }
}

<body>
  <header class="bar">
    <span class="brand">Homestretch</span>
    <div class="tabs" role="tablist" aria-label="Homestretch views">
      <button type="button" class="tab" role="tab" id="queue-tab" aria-selected="true" aria-controls="queue-view">Queue</button>
      <button type="button" class="tab" role="tab" id="run-tab" aria-selected="false" aria-controls="run-view" tabindex="-1">Run</button>
    </div>
    <span class="chip">Prototype</span>
  </header>
  <main>
    <div class="switcher">
      <label for="state">Prototype: show state</label>
      <select id="state">
        <option value="waiting">Waiting</option>
        <option value="running">Running</option>
        <option value="passed">Done passed</option>
        <option value="failed">Done failed</option>
        <option value="single">One merge only</option>
        <option value="overflow">More than 6</option>
      </select>
    </div>
    <section id="queue-view" role="tabpanel" aria-labelledby="queue-tab" tabindex="0"></section>
    <section id="run-view" role="tabpanel" aria-labelledby="run-tab" tabindex="0" hidden></section>
    <footer>Prototype note: the covers list is built from the real recent merges. The live list arrives with the next dashboard update.</footer>
  </main>

  <script>
    'use strict';

    const byId = (id) => document.getElementById(id);
    const readSnapshot = (name) => JSON.parse(byId('snapshot-' + name).textContent);
    const queue = readSnapshot('queue');
    const { runs } = readSnapshot('runs');
    const merges = readSnapshot('merges').map((merge) => ({
      ...merge,
      pr: Number(merge.subject.match(/#(\d+)/)[1]),
      title: merge.subject
        .replace(/^Merge pull request #\d+ from [^/]+\//, '')
        .replace(/ \(#\d+\)$/, '')
    }));
    const burst = [471, 468, 474, 477, 478].map((pr) => merges.find((merge) => merge.pr === pr));
    const head = burst.at(-1);
    const largerBurst = merges.filter((merge) => Date.parse(merge.time) >= Date.parse(burst[0].time)).reverse();
    const headRuns = runs.filter((run) => run.kind === 'run' && run.event === 'push' &&
      run.branch === 'develop' && run.headSha === head.sha);
    const passedRun = headRuns.find((run) => run.status === 'passed');
    const failedRun = headRuns.find((run) => run.status === 'failed');
    const resultWords = {
      success: ['passed', 'Passed'],
      failure: ['failed', 'Failed'],
      error: ['failed', 'Error'],
      cancelled: ['stopped', 'Cancelled'],
      superseded: ['stopped', 'Replaced']
    };
    const state = byId('state');
    const tabs = [byId('queue-tab'), byId('run-tab')];

    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[char]);
    const status = (kind, word) =>
      `<span class="st"><span class="dot ${kind}" aria-hidden="true"></span>${word}</span>`;
    const code = (value) => `<code class="mono">${escapeHtml(value)}</code>`;
    const time = (label, value) => value
      ? `${label} <time datetime="${escapeHtml(value)}">${escapeHtml(value.slice(11, 16))} UTC</time>`
      : '';
    const metadata = (row) => `<div class="meta"><span>${escapeHtml(row.workflow)}</span>${code(row.sha.slice(0, 8))}</div>`;
    const failureNext = '<p class="failure-next">Open the failing step on GitHub, fix it, merge again.</p>'
      + '<p><button type="button" class="inert-action" data-open-step>Open failing step</button> <span class="step-note detail" role="status" hidden>Prototype: the real app opens the failing step on GitHub here.</span></p>';
    const failureDetail = (row) => escapeHtml(row.reason.replace(/^job /, '').replace(/(, step \d+) /, '$1: '));

    function expandButton(id, more, label = '') {
      return `<button type="button" class="disclosure" aria-expanded="false" aria-controls="${id}" data-more="${escapeHtml(more)}">
        ${label ? `<span>${escapeHtml(label)}</span>` : ''}<span class="disclosure-action">${escapeHtml(more)}</span>
      </button>`;
    }

    function mergeList(items, attributes = '') {
      return `<ul class="merge-list"${attributes}>${items.map((merge) => `
        <li data-proto-inert><strong class="pr-number">#${merge.pr}</strong><span>${escapeHtml(merge.title)}</span>${code(merge.shortSha)}</li>`
      ).join('')}</ul>`;
    }

    function queueCovers(items, waiting, hasRunAbove) {
      if (items.length < 2) return '';
      const previewSize = Math.min(items.length - 1, items.length > 6 ? 6 : 3);
      const numbers = items.slice(0, previewSize).map((merge) => '#' + merge.pr).join(', ');
      const remaining = items.length - previewSize;
      const label = `Covers ${numbers} and ${remaining} more`;
      const start = hasRunAbove ? 'Starts when the run above ends' : 'Starts next';
      return `<div class="row-covers">
        <div class="cover-line">
          <span class="cover-label">${escapeHtml(label)}</span>${expandButton('queue-merges', `Show ${remaining} more`)}
          <span class="chip">${items.length} merges, 1 run</span>
          ${waiting ? `<p class="detail">${start}, then checks all ${items.length} together.</p>` : ''}
        </div>
        ${mergeList(items, ' id="queue-merges" aria-label="Covered merges" hidden')}
      </div>`;
    }

    function queueRow(row, [kind, word], detail, timeMarkup, extra = '', featured = false) {
      return `<li class="queue-row${featured ? ' featured' : ''}" data-proto-inert>
        <div>${status(kind, word)}</div>
        <div><div class="job">${escapeHtml(row.label)}</div>${metadata(row)}</div>
        <div class="detail">${detail}</div>
        <div class="row-time">${timeMarkup}</div>
        ${extra}
      </li>`;
    }

    function completedRow(row, extra = '', featured = false) {
      let detail = row.state === 'superseded' ? 'A newer run took its place.' :
        escapeHtml((row.reason || '').replace(/\bpull request\b/gi, 'PR').replace(/\brequest\b/gi, 'run'));
      if (featured && row.conclusion === 'failure') {
        detail = failureDetail(row) + failureNext;
      }
      return queueRow(row, resultWords[row.conclusion] || ['stopped', 'Done'],
        detail, time('finished', row.finishedAt), extra, featured);
    }

    function renderQueue(items, waiting, finished, run, queueEntry) {
      const covers = queueCovers(items, waiting, queue.running.length > 0);
      const current = waiting ? queue.running.map((row) => queueRow(row, ['running', 'Running'],
        `Running on ${code(row.claimedBy)}.`, time('started', row.claimedAt))).join('') : '';
      const active = finished ? '' : queueRow(queueEntry,
        waiting ? ['queued', 'Queued'] : ['running', 'Running'],
        waiting ? '' : `Running on ${code(run.agent)}.`,
        waiting ? time('queued', queueEntry.enqueuedAt) : time('started', run.start), covers, items.length > 1);
      const completed = finished ? completedRow(queueEntry, covers, true) : '';
      const history = queue.done.filter((row) => row.id !== queueEntry.id &&
        (run !== passedRun || row.conclusion === 'success'));
      const preview = history.slice(0, 2).map((row) => completedRow(row)).join('');
      const rest = history.slice(2).map((row) => completedRow(row)).join('');
      byId('queue-view').innerHTML = `
        <h1 class="view-heading">Queue</h1>
        ${current || active ? `<ul class="queue-list panel" aria-label="Now and next">${current}${active}</ul>` : ''}
        <section class="${finished ? '' : 'history '}queue-history" aria-labelledby="history-title">
          <h2 id="history-title">Recently finished</h2>
          <div class="panel">
            <ul class="queue-list">${completed}${preview}</ul>
            ${rest ? `<ul class="queue-list" id="older-runs" hidden>${rest}</ul>` : ''}
          </div>
          ${rest ? expandButton('older-runs', `Show ${history.length - 2} more`) : ''}
        </section>`;
    }

    function renderRun(items, waiting, finished, run, queueEntry) {
      const hasCovers = items.length > 1;
      const failed = finished && run.status === 'failed';
      const remaining = items.length - 3;
      const title = hasCovers ? `Push develop, checks ${items.length} merges` : 'Push develop';
      const runStatus = waiting ? status('queued', 'Queued') :
        finished ? status(run.status, escapeHtml(run.word)) : status('running', 'Running');
      const runTime = waiting ? time('queued', queueEntry.enqueuedAt) :
        finished ? time('finished', queueEntry.finishedAt) : time('started', run.start);
      const coverage = hasCovers ? `<div class="run-cover">
        ${mergeList(items.slice(0, 3), ' aria-label="Covered merges"')}
        ${remaining > 0 ? mergeList(items.slice(3), ' id="run-merges" aria-label="More covered merges" hidden') : ''}
        ${remaining > 0 ? expandButton('run-merges', `Show ${remaining} more`) : ''}
        ${finished ? '' : '<p class="detail">Covered merges get this result on GitHub when the run ends.</p>'}
      </div>` : '';
      const results = finished && hasCovers ? `<section class="panel result-panel" aria-labelledby="results-title">
        <h2 id="results-title">GitHub results</h2>
        ${failed ? '<p class="detail">This run failed. We cannot tell which merge broke it.</p>' : ''}
        <ul class="results">${items.map((merge) => `<li data-proto-inert>
          <strong class="pr-number">#${merge.pr}</strong>
          <span class="message"><span class="dot ${run.status}" aria-hidden="true"></span>
          <span><strong>${failed ? 'Run failed' : 'Run passed'}</strong> on ${code(head.shortSha)}</span></span>
        </li>`).join('')}</ul>
        ${failed ? failureNext : ''}
      </section>` : '';
      byId('run-view').innerHTML = `
        <a class="run-back" href="#queue-view">From the Queue: ${escapeHtml(queueEntry.label)} ${code(head.shortSha)}</a>
        <header class="panel run-head">
          <h1>${title}</h1>
          <div class="meta">${runStatus}<span>${escapeHtml(run.workflow)}</span>${code(head.shortSha)}<span>${runTime}</span></div>
          ${failed ? `<p class="detail run-note">${failureDetail(queueEntry)}</p>` : ''}
          ${waiting && queue.running.length ? '<p class="detail run-note">Waiting for the run on the Queue tab to end.</p>' : ''}
          ${hasCovers ? '' : '<p class="detail run-note">Checks this one merge on its own.</p>'}
          ${coverage}
        </header>
        ${results}`;
    }

    function render() {
      const mode = state.value;
      const items = mode === 'single' ? [head] : mode === 'overflow' ? largerBurst : burst;
      const waiting = ['waiting', 'single', 'overflow'].includes(mode);
      const finished = mode === 'passed' || mode === 'failed';
      const run = mode === 'passed' ? passedRun : failedRun;
      const queueEntry = queue.done.find((row) => row.id === run.request);
      renderQueue(items, waiting, finished, run, queueEntry);
      renderRun(items, waiting, finished, run, queueEntry);
    }

    function selectTab(next, moveFocus = false) {
      for (const tab of tabs) {
        const selected = tab === next;
        tab.setAttribute('aria-selected', String(selected));
        tab.tabIndex = selected ? 0 : -1;
        byId(tab.getAttribute('aria-controls')).hidden = !selected;
      }
      if (moveFocus) next.focus();
    }

    tabs.forEach((tab, index) => {
      tab.addEventListener('click', () => selectTab(tab));
      tab.addEventListener('keydown', (event) => {
        const next = { ArrowLeft: 1 - index, ArrowRight: 1 - index, Home: 0, End: 1 }[event.key];
        if (next === undefined) return;
        event.preventDefault();
        selectTab(tabs[next], true);
      });
    });

    document.querySelector('main').addEventListener('click', (event) => {
      if (event.target.closest('.run-back')) {
        event.preventDefault();
        selectTab(tabs[0], true);
        return;
      }
      const stepButton = event.target.closest('[data-open-step]');
      if (stepButton) {
        stepButton.parentElement.querySelector('.step-note').hidden = false;
        return;
      }
      const button = event.target.closest('.disclosure');
      if (!button) return;
      const expanded = button.getAttribute('aria-expanded') === 'true';
      byId(button.getAttribute('aria-controls')).hidden = expanded;
      button.setAttribute('aria-expanded', String(!expanded));
      button.querySelector('.disclosure-action').textContent = expanded ? button.dataset.more : 'Show fewer';
    });
    state.addEventListener('change', render);
    render();
  </script>

<!--
Round 1 answer
1. Done failed identifies the run-level failure, explains that the culprit merge is unknown,
   and shares the recorded job and step between Queue and Run. Both show the next step.
   Run also shows an inert, labelled Open failing step button.
2. Done passed shows the real passing workflow and filters Queue history to successful rows.
   The failed ci.yml row for 9888212c appears as a finished row only in Done failed.
3. Queue explains when the waiting run starts, including when nothing is running above.
   Run identifies the wait on the Queue tab.
4. Run links back to the Queue tab and moves focus there. The state control is smaller
   and uses a dashed border and the label Prototype: show state.
5. Visible replacement copy says run. The embedded JSON is byte-for-byte unchanged.
6. PR numbers have a minimum width and stay on one line in merge and result rows.
7. Merge titles show the branch name for merge commits and omit PR suffixes for squash commits.
8. Disclosures use a rotating chevron, aria-expanded, and Show N more / Show fewer.
   The Queue disclosure retains its Covers summary.
9. The footer explains where the covers list comes from and when the live list arrives.
10. Timestamps are labelled started, queued, or finished.
11. One merge only says Checks this one merge on its own.

Verification and uncertainty
The default collapsed Queue has about 91 words including the footer. Static and Node checks
covered balanced markup, JSON integrity, JavaScript, all six states, and control behavior.
Browser-level layout and keyboard behavior were not verified. This answer is embedded here
to keep the one-file edit.
-->
