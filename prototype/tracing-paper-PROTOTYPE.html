'use strict';
/* ==================================================================================================
   0. Utilities, clock, time zones
   ================================================================================================== */
const MIN = 60000, H = 3600000, DAY = 86400000;
const NOW = Date.parse('2026-10-20T12:00:00Z');                 // the prototype's "now" (the demo data reference time)

function h53(str, seed = 0) { let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed; for (let i = 0, ch; i < str.length; i++) { ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); } h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909); return 4294967296 * (2097151 & h2) + (h1 >>> 0); }

const BROWSER_ZONE = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; } catch (e) { return 'UTC'; } })();
const zoneId = () => (RT.zone === 'local' ? BROWSER_ZONE : 'UTC');
const zoneName = () => (RT.zone === 'local' ? BROWSER_ZONE : 'UTC');
function fmtDT(ms, o = {}) {                                          // "20 Oct 09:14" in the chosen zone
  const z = o.zone || zoneId();
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-GB', { timeZone:z, day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false }).formatToParts(new Date(ms)).map(x => [x.type, x.value]));

const idOf = name => (name.toLowerCase().replace(/[^a-z2-7]/g, '') + 'a'.repeat(26)).slice(0, 26);

/* ==================================================================================================
   1. The synthetic audit world. Everything (analysis, timeline lanes, evidence rows) derives from these functions of absolute time,
      so two screens that look at the same period always agree.
   ================================================================================================== */
const DATA_FROM = Date.parse('2026-10-13T00:00:00Z');                // the audit source keeps about a week
const OUTAGE = [Date.parse('2026-10-19T02:00:00Z'), Date.parse('2026-10-19T04:00:00Z')];   // the collector was down: no rows

const OPS = [
  { k:'Payroll.Run', kind:'synchronous', rate:5.2, p95:240, e4:.004, e5:.002, slow:5.4, e5x:14, e5i:.14 },
  { k:'Employees.List', kind:'synchronous', rate:6.0, p95:180, e4:.006, e5:.001, slow:1, e5x:1, e5i:.008 },
  { k:'Timesheet.Submit', kind:'synchronous', rate:3.0, p95:210, e4:.01, e5:.002, slow:2.2, e5x:3, e5i:.06 },
  { k:'Leave.Approve', kind:'synchronous', rate:1.4, p95:150, e4:.012, e5:.001, slow:1, e5x:1 },
  { k:'Reports.Generate', kind:'asynchronous', rate:.8, p95:900, e4:.003, e5:.004, slow:1.3, e5x:1 },
  { k:'Payroll.Export', kind:'hangfire', rate:.3, p95:2400, e4:0, e5:.01, slow:1, e5x:1 },

  const per = {}; let total = { n:0, e4:0, e5:0, miss:0, w95:0, w50:0, minutes:0, have:0 };
  const m0 = Math.floor(start / MIN), m1 = Math.ceil(end / MIN);

    for (let m = m0; m < m1; m++) { const v = opMinute(op, m); if (!v) continue; s.n += v.n; s.e4 += v.e4; s.e5 += v.e5; s.miss += v.miss; s.w95 += v.p95 * v.n; s.w50 += v.p50 * v.n; }
    per[op.k] = { op, n:s.n, e4:s.e4, e5:s.e5, miss:s.miss, p95:s.n ? s.w95 / s.n : null, p50:s.n ? s.w50 / s.n : null };
    total.n += s.n; total.e4 += s.e4; total.e5 += s.e5; total.miss += s.miss; total.w95 += s.w95; total.w50 += s.w50; }
  for (let m = m0; m < m1; m++) { total.minutes++; if (available(m)) total.have++; }
