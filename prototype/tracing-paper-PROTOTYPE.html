<script>
'use strict';
/* ====================================================================================
   0. Constants, helpers
   ==================================================================================== */
const MIN = 60000, H = 3600000, DAY = 86400000;
const NOW0 = Date.parse('2026-09-01T12:00:00Z');        // fake "now"
const RUNGS = [60,300,600,900,3600,7200,14400,21600,28800,43200,86400].map(s => s * 1000);
const SRC = [
  { id:'cs_audit', lane:'audit', kind:'audit-mongo', label:'Orders API audit (Mongo)',        mode:'live' },
  { id:'cs_sql',   lane:'sql',   kind:'sql-xe',      label:'SQL Server PROD-01 (Query Store)', mode:'pull' },
  { id:'cs_iis',   lane:'iis',   kind:'iis-w3c',     label:'IIS site A (W3C logs)',            mode:'file' },
  { id:'cs_iis2',  lane:'iis',   kind:'iis-w3c',     label:'IIS site B (W3C logs)',            mode:'file' },
];
const LANES = ['audit','sql','iis'];
const LANE_LABEL = { audit:'API audit', sql:'SQL', iis:'IIS' };
const FILTERS = { all:'All events', slow:'Slow queries only (> 1000 ms)' };
const src = id => SRC.find(s => s.id === id);
const laneSrc = lane => SRC.find(s => s.lane === lane);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso = ms => new Date(ms).toISOString().replace('.000Z', 'Z');
const short = ms => iso(ms).slice(5, 16).replace('T', ' ');          // MM-DD HH:MM
const win = (a, b) => iso(a) + ' → ' + iso(b);

function h53(str, seed = 0) {                                           // prototype hash (stands in for SHA-256)
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0, ch; i < str.length; i++) { ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}
const hex = s => h53(s).toString(16).padStart(14, '0');
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function fmtDur(ms) {
  if (ms < H) { const m = ms / MIN; return m >= 1 ? (m + (m === 1 ? ' minute' : ' minutes')) : (ms / 1000 + ' seconds'); }
  if (ms < DAY) { const h = ms / H; return h + (h === 1 ? ' hour' : ' hours'); }
  const d = ms / DAY; return d + (d === 1 ? ' day' : ' days');
}
function fmtSpan(ms) {
  const d = Math.floor(ms / DAY), h = Math.floor(ms % DAY / H), m = Math.floor(ms % H / MIN), s = Math.floor(ms % MIN / 1000);
  return [d && d + ' d', h && h + ' h', m && m + ' min', s && s + ' s'].filter(Boolean).join(' ') || '0';
}

/* ====================================================================================
   1. Axis math (spec 4.5 / 7: one UTC floor-aligned, never-re-anchored presentation axis)
   ==================================================================================== */
function ladderWidth(span) {
  if (span <= 2 * H) return 60000;
  if (span <= 24 * H) return [300000, 600000, 900000].find(w => Math.ceil(span / w) <= 120);
  if (span <= 5 * DAY) return 3600000;
  if (span <= 10 * DAY) return 7200000;
  if (span <= 20 * DAY) return 14400000;
  if (span <= 30 * DAY) return 21600000;
  return null;                                                           // > 30 d: refused with 400
}
function axis(start, end) {
  const span = end - start;
  const L = ladderWidth(span);
  if (L === null || span <= 0) return null;
  const axisStart = Math.floor(start / H) * H, axisEnd = Math.ceil(end / H) * H;
  const aligned = RUNGS.find(w => Math.ceil((axisEnd - axisStart) / w) <= 120);
  const W = Math.max(L, aligned);
  const n = Math.ceil((axisEnd - axisStart) / W);
  // boundary raw scans: zero when aligned, one when exactly one edge is set or both share a grain-hour, else two
  const sEdge = start % H !== 0, eEdge = end % H !== 0;
  let scans = [], why;
  if (!sEdge && !eEdge) { why = 'both edges are on a UTC hour: rollup rows only, no raw scan'; }
  else if (sEdge && eEdge && Math.floor(start / H) === Math.floor(end / H)) { scans = [{ name:'shared fragment', from:start, to:end }]; why = 'both edges sit inside the same UTC hour: one shared raw query'; }
  else if (sEdge && eEdge) { scans = [{ name:'start fragment', from:start, to:Math.ceil(start / H) * H }, { name:'end fragment', from:Math.floor(end / H) * H, to:end }]; why = 'both edges are off the hour and in different hours: two raw queries'; }
  else if (sEdge) { scans = [{ name:'start fragment', from:start, to:Math.min(end, Math.ceil(start / H) * H) }]; why = 'exactly one edge is off the hour: one raw query'; }
  else { scans = [{ name:'end fragment', from:Math.max(start, Math.floor(end / H) * H), to:end }]; why = 'exactly one edge is off the hour: one raw query'; }
  const slots = [];
  for (let k = 0; k < n; k++) {
    const s = axisStart + k * W, e = s + W, lo = Math.max(s, start), hi = Math.min(e, end);
    const empty = hi <= lo;
    slots.push({ k, s, e, empty, clipped: !empty && (lo > s || hi < e), frag: !empty && scans.some(f => f.from < hi && lo < f.to) });
  }
  return { start, end, span, axisStart, axisEnd, ladder: L, alignedRung: aligned, W, n, inWindow: slots.filter(x => !x.empty).length, scans, scanWhy: why, slots };
}

function pullWords(r) {
  if (!r) return null;
  const d = [r.status + ' · ' + r.outcome, r.attemptId ? 'attempt ' + r.attemptId : '', r.eventsWritten !== undefined ? plural(r.eventsWritten, 'event') + ' written' : ''].filter(Boolean).join(' · ');
  let tone, title, body = r.note || '';
  if (r.status === 400) { tone = 'bad'; title = 'That window is not allowed'; body = r.error; }
  else if (r.status === 409 && r.error && r.error.startsWith('409 window-overlap')) { tone = 'warn'; title = 'Not pulled: the window overlaps a stored pull'; body = r.note + ' Pull exactly that stored window again to refresh it, or choose a window that does not overlap.'; }
  else if (r.status === 409) { tone = 'bad'; title = 'Not allowed'; body = r.error; }
  else if (r.status === 502) { tone = 'bad'; title = 'The source could not be reached'; body = 'The connection dropped part way through (' + r.error + '). Nothing was saved. The attempt is recorded but never counts as coverage.'; }
  else if (r.status === 500) { tone = 'bad'; title = 'Saving failed and was rolled back'; body = 'The previous stored pull is untouched and the case revision did not move. (' + r.error + ')'; }
  else if (r.outcome === 'unchanged') { tone = 'grey'; title = 'Nothing new'; body = 'The source returned exactly the same data as the stored pull for this window, so nothing was changed.'; }
  else if (r.outcome === 'duplicate') { tone = 'grey'; title = 'This file is already imported'; body = 'Same file content as one already in the case, so nothing was added.'; }
  else if (r.outcome === 'changed') { tone = 'ok'; title = 'Updated: the stored pull was replaced'; body = 'The source returned different data for this exact window, so the stored pull (import #' + r.superseded.importId + ', ' + plural(r.superseded.eventsRemoved, 'event') + ') was replaced as a whole by import #' + r.importId + ' (' + plural(r.eventsWritten, 'event') + '). Totals are not double counted.'; }
  else if (r.outcome === 'completed') { tone = 'ok'; title = 'Pulled and saved'; body = 'Read ' + plural(r.eventsWritten, 'event') + ' for exactly this window and saved them. Coverage now includes it.'; }
  else if (r.outcome === 'imported') { tone = 'ok'; title = 'File imported'; body = plural(r.eventsWritten, 'event') + ' from ' + r.fileName + '. Coverage now includes it.'; }
  else { tone = 'grey'; title = r.outcome; }
  return { tone, title, body, d, extra:[r.legacyWouldSayUnchanged, r.warning].filter(Boolean) };
}

/* ====================================================================================
   13. Boot (reads #screen=…&scenario=… so a state is shareable)
   ==================================================================================== */
function fromHash() {
  const p = new URLSearchParams((location.hash || location.search).replace(/^[#?]/, ''));
  if (['A', 'B', 'C'].includes(p.get('variant'))) UI.variant = p.get('variant');
  const screen = ['case', 'evidence', 'tracing', 'export'].includes(p.get('screen')) ? p.get('screen') : 'case', sc = p.get('scenario');
  if (sc && scenList(screen).some(x => x.id === sc)) { if (!(S.scen && S.scen.id === sc && S.screen === screen)) loadScenario(screen, sc); }
  else if (S.screen !== screen) { S.screen = screen; render(); }
  else render();
}
window.addEventListener('hashchange', fromHash);
if (innerWidth < 900) UI.notesOpen = false;
fromHash();
