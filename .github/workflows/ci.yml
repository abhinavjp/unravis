name: CI

# Runs on every push to master and on every pull request.
# The runner is pinned (windows-2022, not windows-latest): it is also the reference
# renderer for the screenshots, so it must not change without anyone choosing it.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      # Third-party actions are pinned to a full commit SHA. The tag in the comment is
      # the release that SHA was checked against. To update one, look up the new SHA
      # (git ls-remote https://github.com/actions/<name>.git refs/tags/<tag>) and change both.
      - name: Check out the code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tools/screens/package-lock.json

      - name: Web - install
        working-directory: web
        run: npm ci

      - name: Web - type check
        working-directory: web
        run: npm run check

      - name: Web - tests
        working-directory: web
        run: npm test

      - name: Web - build
        working-directory: web
        run: npm run build

      - name: Go - vet
        run: go vet ./...

      - name: Go - tests
        run: go test ./...

      - name: Go - modules are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build dist\unravis.exe
        # The web step above already built web/dist, so it is skipped here.
        run: ./build.ps1 -SkipWeb -Version "ci-$($env:GITHUB_SHA.Substring(0, 7))"

      - name: Screenshots - install
        working-directory: tools/screens
        run: |
          npm ci
          npx playwright install chromium

      - name: Screenshots - tests of the tools themselves
        working-directory: tools/screens
        run: npm test

      - name: Screenshots - compare with the saved pictures
        run: ./tools/screens/run-screens.ps1

      - name: Docs - check links and screens
        working-directory: tools/screens
        run: node docs-check.mjs

      - name: Screenshots - keep the differences
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshot-differences
          path: tools/screens/test-results
          if-no-files-found: ignore
          retention-days: 14
