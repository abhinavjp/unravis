name: CI

# Full CI. Runs on every push to master and to develop, and on every pull request into master (with the release train
# that is the pull request that promotes develop; pull requests into develop run fast-gate.yml instead, see docs/ci/RELEASE-TRAIN.md).
#
# Shape (BL-197 speed-up). The required status check is the job named `build` and nothing else:
# it is a thin gate that needs the parallel jobs below and fails when any of them fails. Branch
# protection keeps asking for `build`, so every gate that used to run in the one long Windows job
# still has to pass before a merge. What changed is only how the work is laid out:
#   changes     decides whether the pull request touches only notes (docs outside docs/user, .forge, root *.md).
#               Notes-only pull requests skip the heavy jobs and the gate still passes. Anything else, a
#               push to master and a manual run always run everything.
#   web         web install, type check, tests, build, and the committed-build check (BL-031).
#   go-tests    `go test ./...` split in 3 shards that run side by side (tools/ci/shard-go-packages.mjs).
#               Every package is in exactly one shard; the split is computed from `go list ./...`.
#   package     go vet, gofmt of changed files, go mod tidy, release script self-test, the exe build,
#               the UPX guard, the screenshots and the docs check.
#   build       the gate.
# The Go build cache and the exe build's own cache (.dev/toolchains/cache) are restored on every run
# and saved by pushes to master, once a week, so a pull request starts warm.
#
# Committed web build (BL-031): web/dist, cmd/unravis-setup/ui and cmd/unravis-lite/ui are committed and
# embedded in the exe, but pull requests into develop do NOT rebuild them (docs/pipeline/dist-on-promotion.md): the
# promotion (tools/release/Promote-Develop.ps1) rebuilds and commits them once. So the step "Web - built files match
# what is committed" compares the build output with the commit byte for byte on the promotion pull request and on
# master (the release gate), and is skipped on pushes to develop, where the committed files are the last promoted ones.
# On master the exe is built from the committed files, which that step proves equal to a fresh build. On develop the
# exe (and so the screenshots, which only warn until RUNNER-BASELINES.txt exists) is built from the last promoted files:
# no second web build is run per push (Windows minutes). The `web` job above still builds the current source on every run.
#
# The runner is pinned (windows-2022, not windows-latest): it is also the reference
# renderer for the screenshots, so it must not change without anyone choosing it.
#
# Screenshot baselines and this runner (decision recorded in the P1 fix report):
# the pictures in docs/user/screenshots were first made on a developer PC, and text
# is drawn a little differently on every machine. So the screenshot compare step is
# NON-BLOCKING (it reports a warning and keeps the differences) until the file
# docs/user/screenshots/RUNNER-BASELINES.txt is committed. That file only ever comes
# out of the "regenerate baselines" run below, which is how the runner's own pictures
# reach the repo. Once it is committed, a difference fails the build.
#
# To regenerate: Actions, CI, "Run workflow", tick "Regenerate screenshot baselines".
# The run skips the compare, takes new pictures on the runner and uploads them as the
# artifact "screenshot-baselines". Unzip it over docs/user/screenshots in a clone and
# commit it (the marker file comes with the pictures).
on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      regenerate_baselines:
        description: Regenerate screenshot baselines on this runner and upload them (no compare)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A push to master gets its own group per commit and is never cancelled: the release manager pins a master commit whose
  # run on master is green, and a newer merge must not cancel that run. A push to develop is cancelled by the next one
  # (only the newest develop commit needs the full run). A pull request is cancelled by its own next push.
  group: ci-${{ github.workflow }}-${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' }}

jobs:
  changes:
    # Notes-only pull requests (docs outside docs/user, .forge, root *.md, LICENSE, NOTICE) skip the heavy jobs.
    # docs/user is heavy: it is embedded in the exe, read by Go tests and checked against the screenshots.
    # docs/desktop/baseline-go-tests.txt and baseline-go-race.txt are heavy: the Linux and the race known-failure baselines.
    # No pull request event, an empty diff or any other doubt means "run everything".
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The checked-out commit of a pull request is the merge with the base branch; its first parent is the base tip.
          fetch-depth: 2

      - name: Do the changed files need the heavy jobs?
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "Not a pull request: running everything."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --no-renames --name-only HEAD^1 HEAD || true)"
          if [ -z "$files" ]; then
            echo "No changed files found: running everything."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r f; do
            if printf '%s\n' "$f" | grep -Eiq '^(docs/user/|docs/desktop/baseline-go-(tests|race)\.txt$|docs/ci/flaky-tests\.txt$)'; then
              code=true; echo "heavy: $f"
            elif printf '%s\n' "$f" | grep -Eq '^(\.forge/|docs/|[^/]+\.md$|LICENSE$|NOTICE$)'; then
              echo "notes: $f"
            else
              code=true; echo "heavy: $f"
            fi
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "false" ]; then echo "::notice::Only notes changed, so the heavy jobs are skipped. The build gate still passes."; fi

  web:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      # Third-party actions are pinned to a full commit SHA. The tag in the comment is
      # the release that SHA was checked against. To update one, look up the new SHA
      # (git ls-remote https://github.com/actions/<name>.git refs/tags/<tag>) and change both.
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web - install
        working-directory: web
        run: npm ci

      - name: Web - type check
        if: ${{ !cancelled() }}
        working-directory: web
        run: npm run check

      - name: Web - tests
        if: ${{ !cancelled() }}
        working-directory: web
        run: npm test

      - name: Code mode declarations compile (BL-364)
        # internal/codemode/bindings/testdata/unravis.d.ts with the pinned TypeScript of this build; test tool only, never shipped.
        if: ${{ !cancelled() }}
        run: node tools/codemode/check-dts.mjs

      - name: Web - build
        if: ${{ !cancelled() }}
        working-directory: web
        run: npm run build

      - name: Web - built files match what is committed
        # BL-031. Fails when `npm run build` gives bytes other than the committed web/dist,
        # cmd/unravis-setup/ui and cmd/unravis-lite/ui. Runs on the promotion pull request and on master, not on develop
        # (develop holds the last promoted files by design). Fix on a promotion: run Promote-Develop.ps1 again (it rebuilds
        # and commits them); on a hotfix pull request into master: run `npm run build` in web and commit the three folders.
        if: ${{ github.ref != 'refs/heads/develop' }}
        working-directory: web
        run: |
          node --version
          npm --version
          node scripts/check-dist.cjs

  go-tests:
    # `go test ./...` in 3 shards. tools/ci/shard-go-packages.mjs gives every package to exactly one shard
    # (self-test: node tools/ci/test-shard.mjs). The weights in tools/ci/go-shard-weights.json only balance
    # the load; a missing or stale number makes a shard slower, it never drops a package.
    name: go-tests (${{ matrix.shard }}/3)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Go build cache - where and which week
        id: cachekey
        shell: bash
        run: |
          echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-W%V)-$(go env GOVERSION)" >> "$GITHUB_OUTPUT"

      - name: Go build cache - restore
        id: gocache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cachekey.outputs.dir }}
          key: go-build-${{ runner.os }}-shard${{ matrix.shard }}-${{ hashFiles('go.sum') }}-${{ steps.cachekey.outputs.week }}
          restore-keys: |
            go-build-${{ runner.os }}-shard${{ matrix.shard }}-${{ hashFiles('go.sum') }}-
            go-build-${{ runner.os }}-shard${{ matrix.shard }}-

      - name: Go - tests (shard ${{ matrix.shard }} of 3)
        shell: bash
        run: |
          set -euo pipefail
          # The split itself is tested first, and a shard that comes back empty fails (it would otherwise run no tests and pass).
          node tools/ci/test-shard.mjs
          node tools/ci/shard-go-packages.mjs --check --of 3
          packages="$(node tools/ci/shard-go-packages.mjs --shard "${{ matrix.shard }}" --of 3)"
          [ -n "$packages" ] || { echo "::error::Shard ${{ matrix.shard }} has no packages."; exit 1; }
          echo "$packages"
          # shellcheck disable=SC2086
          go test -p 2 -timeout 25m $packages

      - name: Go build cache - save (master and develop pushes, once a week)
        if: ${{ success() && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop') && steps.gocache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cachekey.outputs.dir }}
          key: go-build-${{ runner.os }}-shard${{ matrix.shard }}-${{ hashFiles('go.sum') }}-${{ steps.cachekey.outputs.week }}

  package:
    # Everything that is about the Go sources as a whole and about the exe: vet, formatting, tidy modules,
    # release script self-test, the exe build, the UPX guard, the screenshots and the docs check.
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the formatting step can find where the pull request branched off.
          fetch-depth: 0

      - name: Screenshot baselines are not regenerated on develop
        # develop holds the last promoted web files, so a run here would photograph the old UI (docs/pipeline/dist-on-promotion.md).
        # Run "Regenerate screenshot baselines" on a promote/* branch or on master.
        if: ${{ inputs.regenerate_baselines == true && github.ref == 'refs/heads/develop' }}
        shell: bash
        run: |
          echo "::error::Do not regenerate the screenshot baselines on develop: its exe embeds the last promoted web files, not the current source. Run it on a promote/* branch or on master."
          exit 1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
          cache: npm
          cache-dependency-path: tools/screens/package-lock.json

      - name: Caches - which week
        id: cachekey
        shell: bash
        run: |
          echo "week=$(date -u +%G-W%V)-$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
          echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      - name: Exe build cache - restore
        # build.ps1 keeps its own Go build and module caches under .dev/toolchains/cache (not the runner's default).
        id: execache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .dev/toolchains/cache/build
            .dev/toolchains/cache/mod
          key: go-exe-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.cachekey.outputs.week }}
          restore-keys: |
            go-exe-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-exe-${{ runner.os }}-

      - name: Go build cache (vet) - restore
        id: vetcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cachekey.outputs.dir }}
          key: go-vet-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.cachekey.outputs.week }}
          restore-keys: |
            go-vet-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-vet-${{ runner.os }}-

      - name: Go - vet
        run: go vet ./...

      # BL-422: the sidecar tag (no embedded dashboard) must keep compiling; only the root package has a tagged test.
      - name: Go - build and root test with the tauri_sidecar tag
        run: go build -tags tauri_sidecar ./... && go test -tags tauri_sidecar .

      # Only the Go files this pull request changes are checked, judged on the committed
      # text (not the working copy, whose line endings may differ). Older files on master
      # that are not gofmt-clean are a separate pass (BL-032). gofmt -l exits 0 when it lists
      # files, so the step tests its output; a gofmt failure (syntax error) or any stderr
      # also fails the step. Renamed files count (R) and names are NUL-separated.
      - name: Go - formatting of changed files
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin "${GITHUB_BASE_REF}"
          merge="$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)"
          files=()
          while IFS= read -r -d '' f; do files+=("$f"); done < <(git diff -z --name-only --diff-filter=ACMR "$merge" HEAD -- '*.go')
          unformatted=()
          errfile="$(mktemp)"
          for f in "${files[@]}"; do
            if ! out="$(git show "HEAD:$f" | gofmt -l 2>"$errfile")" || [ -s "$errfile" ]; then
              echo "::error::gofmt could not check $f: $(cat "$errfile")"
              exit 1
            fi
            if [ -n "$out" ]; then
              unformatted+=("$f")
            fi
          done
          if [ "${#unformatted[@]}" -gt 0 ]; then
            echo "::error::These Go files changed by this pull request are not gofmt-clean (judged on committed text):"
            printf '  %s\n' "${unformatted[@]}"
            echo "Run gofmt -w on them and commit. Older files on master are a separate pass."
            exit 1
          fi
          echo "All ${#files[@]} changed Go files are gofmt-clean."

      - name: Go - modules are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Release scripts - checksum self-test
        shell: pwsh
        run: ./tools/release/Test-Release.ps1

      - name: Build dist\unravis.exe
        # The web files are the committed ones, so the web build is skipped. On master and on promotion the `web` job proves they
        # equal a fresh build; on develop they are the last promoted ones (docs/pipeline/dist-on-promotion.md). The go-tests jobs
        # already ran go test, so the tests are skipped too.
        run: ./build.ps1 -SkipWeb -SkipTests -Version "ci-$($env:GITHUB_SHA.Substring(0, 7))"

      - name: No UPX in dist (BL-421 guard and its self-test)
        shell: pwsh
        run: |
          ./tools/release/Test-NoUpx.Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Test-NoUpx self-test failed.' }
          ./tools/release/Test-NoUpx.ps1 -Path dist
          if ($LASTEXITCODE -ne 0) { throw 'a packed exe is in dist.' }
          Get-ChildItem dist -Filter *.exe | Select-Object Name, Length

      - name: Screenshots - install
        working-directory: tools/screens
        run: |
          npm ci
          npx playwright install chromium

      - name: Screenshots - tests of the tools themselves
        working-directory: tools/screens
        run: npm test

      - name: Screenshots - are the saved pictures from this runner?
        id: reference
        shell: pwsh
        run: |
          $blocking = Test-Path -LiteralPath docs/user/screenshots/RUNNER-BASELINES.txt -PathType Leaf
          "blocking=$($blocking.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if (-not $blocking) {
            Write-Host '::notice::The saved screenshots were not made on this runner yet, so a difference only warns. Run this workflow with "Regenerate screenshot baselines" and commit the result.'
          }

      - name: Screenshots - compare with the saved pictures
        id: compare
        if: ${{ inputs.regenerate_baselines != true }}
        # Until baselines from the runner are committed, a difference is a warning, not a failure.
        continue-on-error: ${{ steps.reference.outputs.blocking != 'true' }}
        run: ./tools/screens/run-screens.ps1

      - name: Screenshots - warn that the compare did not match
        if: ${{ steps.compare.outcome == 'failure' && steps.reference.outputs.blocking != 'true' }}
        shell: pwsh
        run: Write-Host '::warning::Screenshots differ from the saved pictures. Not blocking, because those pictures were not made on this runner. Regenerate them (see the top of ci.yml).'

      - name: Screenshots - regenerate baselines on this runner
        if: ${{ inputs.regenerate_baselines == true }}
        run: |
          ./tools/screens/run-screens.ps1 -Update
          "Made on the CI runner (windows-2022) by workflow run $($env:GITHUB_RUN_ID), commit $($env:GITHUB_SHA)." | Set-Content -Encoding utf8 docs/user/screenshots/RUNNER-BASELINES.txt

      - name: Screenshots - keep the regenerated baselines
        if: ${{ inputs.regenerate_baselines == true }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-baselines
          path: docs/user/screenshots
          if-no-files-found: error
          retention-days: 14

      - name: Docs - check links and screens
        working-directory: tools/screens
        run: node docs-check.mjs

      - name: Screenshots - keep the differences
        if: ${{ always() && (failure() || steps.compare.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-differences
          path: tools/screens/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Exe build cache - save (master and develop pushes, once a week)
        if: ${{ success() && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop') && steps.execache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .dev/toolchains/cache/build
            .dev/toolchains/cache/mod
          key: go-exe-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.cachekey.outputs.week }}

      - name: Go build cache (vet) - save (master and develop pushes, once a week)
        if: ${{ success() && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop') && steps.vetcache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cachekey.outputs.dir }}
          key: go-vet-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.cachekey.outputs.week }}

  build:
    # THE REQUIRED CHECK. Branch protection asks for a check named `build`; keep this job id and no `name:`.
    # It passes when every heavy job passed, or when the changes job found only notes and the heavy jobs were skipped.
    # It never skips itself, so a failed, cancelled or missing heavy job always fails it.
    needs: [changes, web, go-tests, go-race, package]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CHANGES: ${{ needs.changes.result }}
      CODE: ${{ needs.changes.outputs.code }}
      WEB: ${{ needs.web.result }}
      GO_TESTS: ${{ needs.go-tests.result }}
      GO_RACE: ${{ needs.go-race.result }}
      PACKAGE: ${{ needs.package.result }}
    steps:
      - name: Every gate passed
        shell: bash
        run: |
          echo "changes=$CHANGES code=$CODE web=$WEB go-tests=$GO_TESTS go-race=$GO_RACE package=$PACKAGE"
          if [ "$CHANGES" != "success" ]; then echo "::error::The changes job did not succeed ($CHANGES)."; exit 1; fi
          if [ "$CODE" = "true" ]; then want=success; elif [ "$CODE" = "false" ]; then want=skipped; else echo "::error::The changes job gave no answer (code='$CODE')."; exit 1; fi
          bad=0
          for pair in "web=$WEB" "go-tests=$GO_TESTS" "go-race=$GO_RACE" "package=$PACKAGE"; do
            if [ "${pair#*=}" != "$want" ]; then echo "::error::${pair%%=*} is ${pair#*=}, expected $want."; bad=1; fi
          done
          exit $bad

  desktop-sidecar:
    # BL-330. The Windows-only tests of the desktop sidecar's pipe code (internal/pipesec: first instance, full instance pool,
    # logon-SID DACL, remote reject, peer and server checks). Later sidecar items (BL-301 and on) add their packages here.
    # Also builds with the `e2e` tag, which only tests use, so that variant cannot rot.
    # Matrix windows-2022 and windows-2025 for the pipe tests, as spec 08 D2 says. The go-tests shards of the `build` gate also run these tests (go test ./...).
    # RV-CI-1: skipped for a notes-only pull request, like the jobs above. Not part of `build`'s needs and not a required check, so a skip blocks nothing.
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Vet (default and e2e tags)
        shell: pwsh
        run: |
          go vet ./internal/pipesec/... ./internal/pipesrv/... ./internal/locator/... ./internal/appdirs/... ./cmd/audit-explorer/...
          if ($LASTEXITCODE -ne 0) { exit 1 }
          go vet -tags e2e ./internal/pipesec/... ./internal/pipesrv/...
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Pipe security tests
        shell: pwsh
        run: |
          go test -count=1 -v ./internal/pipesec/...
          if ($LASTEXITCODE -ne 0) { exit 1 }
          go test -count=1 -tags e2e ./internal/pipesec/...
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Pipe server tests (BL-301)
        # internal/pipesrv serves the handler over the real ui and ag pipes; cmd/audit-explorer holds TestPipeOnlyNoListenerNoSessionFile
        # and the flag rules. The Windows build job runs them too (go test ./...).
        shell: pwsh
        run: |
          go test -count=1 -v ./internal/pipesrv/...
          if ($LASTEXITCODE -ne 0) { exit 1 }
          go test -count=1 -v -run '^(TestPipeOnlyNoListenerNoSessionFile|TestPipeServerLoopbackKeepsBrowserModeListener|TestPipeFlagRules|TestPipeRejectsRemoteFlag|TestServeOverPipeSameJSONAsLoopback|TestListenerPortNilIsZero|TestNoTCPListenerInPipeMode)$' ./cmd/audit-explorer/...
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Locator tests (BL-302)
        # internal/locator: round trip, alive/dead/reused pid, real pipes through WaitNamedPipe, owner-only ACL (icacls).
        # cmd/audit-explorer: ten concurrent real starts leave one owner (the rest exit 12); a killed owner's locator is replaced.
        shell: pwsh
        run: |
          go test -count=1 -v ./internal/locator/... ./internal/appdirs/...
          if ($LASTEXITCODE -ne 0) { exit 1 }
          go test -count=1 -v -run '^(TestPipeModeSecondCopyExits12|TestPipeModeSecondCopyNoLocator|TestPipeModeWritesAndRemovesLocator|TestPipeModeLocatorFailureIsFatal|TestTenConcurrentStartsOneOwner|TestStaleLocatorReplacedAfterKill)$' ./cmd/audit-explorer/...
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Shutdown RPC tests (BL-303)
        # Linux-portable proofs (route on the ui pipe only, token, WAL checkpoint on app-created cases) plus the Windows-only ones:
        # TestShutdownCleanRealExe (real exe, real ui pipe, writers busy, exit 0 within 5 s, no -wal/-shm, integrity_check ok) and
        # TestKillDuringWriteReopens (TerminateProcess mid-write, reopen, integrity_check ok, saved lines kept).
        shell: pwsh
        run: |
          go test -count=1 -v -run '^(TestShutdown.*|TestKillDuringWriteReopens)$' ./cmd/audit-explorer/... ./internal/pipesrv/...
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Adapter parity and Windows power policy
        shell: pwsh
        run: |
          go test -count=1 -v ./internal/power
          if ($LASTEXITCODE -ne 0) { exit 1 }
          go test -count=1 -v -run '^(TestParity.*|TestSnapshot.*)$' ./internal/clicore/cmdtree
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Real exe in pipe-only mode (no port, no session file, both pipes)
        shell: pwsh
        run: ./tools/desktop/Test-Sidecar.ps1 -Check NoPort

      - name: Real exe in pipe-only mode (a second listener on the same pipe name is refused)
        shell: pwsh
        run: ./tools/desktop/Test-Sidecar.ps1 -Check Squat

      - name: Real exe, ten simultaneous starts (one owner)
        shell: pwsh
        run: ./tools/desktop/Test-Sidecar.ps1 -Check TenStarts

      - name: Real exe, killed owner (stale locator replaced)
        shell: pwsh
        run: ./tools/desktop/Test-Sidecar.ps1 -Check Stale

      - name: Real exe, locator file ACL (icacls)
        shell: pwsh
        run: ./tools/desktop/Test-Sidecar.ps1 -Check Acl

  linux-gates:
    # BL-441. Lint, vet, race tests against a known-failure baseline, and the web checks, on Linux.
    # The Windows `build` job stays the correctness gate. A few tests are Windows-only and fail here;
    # they are listed in docs/desktop/baseline-go-tests.txt and only a failure NOT in that file fails the job.
    # RV-CI-1: skipped for a notes-only pull request (the `changes` job). Not part of `build`'s needs and not a required check, so a skip blocks nothing.
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: golangci-lint judges only code the change adds (new-from-merge-base).
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Go - vet
        run: go vet ./...

      - name: Go - lint tool, which version and where it is kept
        # RV-CI-2: building golangci-lint took 33 to 44 seconds on every run (five runs on 2026-11-26), so the built tool is kept
        # between runs. The key holds the tool version and the Go that builds it: a new tool version, or a new Go from go.mod,
        # misses the cache and builds again. The version is written here once; the install and the key both read it.
        id: golangci
        run: |
          version=v2.15.0
          bin="${RUNNER_TEMP}/golangci-lint-bin"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "bin=${bin}" >> "$GITHUB_OUTPUT"
          # Runner OS, CPU and image are in the key: a binary built on one is not assumed to run on another.
          echo "key=golangci-lint-${version}-${RUNNER_OS}-${RUNNER_ARCH}-${ImageOS:-noimage}-$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
          echo "${bin}" >> "$GITHUB_PATH"

      - name: Go - lint tool, restore
        id: golangci-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.golangci.outputs.bin }}
          key: ${{ steps.golangci.outputs.key }}

      - name: Go - lint tool, check the restored copy
        # A restored copy that is missing, broken or the wrong version is not used: it is built again below and not saved
        # (the cache cannot replace a key that exists, so the bad copy stays until the key changes or the entry is deleted).
        id: golangci-check
        if: ${{ steps.golangci-cache.outputs.cache-hit == 'true' }}
        env:
          GOLANGCI_LINT_VERSION: ${{ steps.golangci.outputs.version }}
          GOLANGCI_LINT_BIN: ${{ steps.golangci.outputs.bin }}
          GOLANGCI_KEY: ${{ steps.golangci.outputs.key }}
        run: |
          want="${GOLANGCI_LINT_VERSION#v}"
          if got="$("${GOLANGCI_LINT_BIN}/golangci-lint" version 2>&1)" && printf '%s\n' "$got" | grep -qF "$want"; then
            echo "Restored golangci-lint is the expected version $want."
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The restored golangci-lint is not usable or not version $want (got: $got). Building it again. To stop this on every run, delete the bad entry: gh cache delete ${GOLANGCI_KEY}"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Go - install golangci-lint (only when the cache had no usable copy)
        if: ${{ steps.golangci-cache.outputs.cache-hit != 'true' || steps.golangci-check.outputs.ok != 'true' }}
        # Built here with the module's Go, not downloaded: the released binaries are built with Go 1.26
        # and refuse a module that says go 1.27 ("Go language version used to build golangci-lint is lower").
        # Go from go.mod is first on PATH (setup-go), so this builds with it.
        env:
          GOBIN: ${{ steps.golangci.outputs.bin }}
          GOLANGCI_LINT_VERSION: ${{ steps.golangci.outputs.version }}
        run: go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"

      - name: Go - lint tool, save
        # Right after the build, not at the end of the job: a lint finding must not throw the built tool away.
        # Only on master and develop pushes, like the other cache saves, so a pull request never writes the shared cache.
        # Never after a cache hit (a bad copy under the same key is not overwritten, see the check above).
        if: ${{ success() && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop') && steps.golangci-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.golangci.outputs.bin }}
          key: ${{ steps.golangci.outputs.key }}

      - name: Go - lint (only code changed since the base branch or the previous head)
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            # First push of a branch has an all-zero "before"; after a force-push it may not exist any more.
            # Then fall back to the config (new-from-merge-base: origin/master). --new-from-rev wins over it when given.
            if [ -n "$before" ] && ! echo "$before" | grep -Eq '^0+$' && git cat-file -e "$before^{commit}" 2>/dev/null; then
              golangci-lint run --new-from-rev="$before"
            else
              echo "No usable previous head ($before); linting against the merge base with origin/master."
              golangci-lint run
            fi
          else
            golangci-lint run
          fi

      - name: Go - tests of the failure comparer
        run: node tools/ci/test-compare.mjs

      - name: Go - tests (compared with the baseline)
        env:
          CGO_ENABLED: "0"
        # No -race here: budget tests (time, memory) fail under the race detector on the runner and made the gate flaky.
        # The race run is the separate blocking job go-race.
        # -skip: these two tests hang until the timeout on Linux (the blackbox host waits for a port that never frees).
        # They are the only skips; every other Linux failure is in the baseline file.
        # The baseline holds known failures, so go test exits 1 on every run. Tolerate that exit code here;
        # the compare step below is the pass/fail gate. Fail here only when go test produced no JSON at all
        # (build or setup problem) or exited with something other than a test failure (0 or 1).
        run: |
          set +e
          go test -count=1 -timeout 25m -coverprofile=go-linux.cover -skip '^TestRunHost(KeepsRecordingWhenThePortIsBusyAndTakesItLater|StopWhileWaitingForAPortReturns)$' -json ./... > go-test.json
          code=$?
          echo "go test exit code: $code"
          if [ ! -s go-test.json ]; then echo "go test produced no JSON"; exit 1; fi
          if [ "$code" -gt 1 ]; then exit "$code"; fi
          exit 0

      - name: Go - keep the coverage profile
        if: ${{ always() && hashFiles('go-linux.cover') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-linux-cover
          path: go-linux.cover
          retention-days: 14

      - name: Web - install
        if: ${{ !cancelled() }}
        working-directory: web
        run: npm ci

      - name: Web - type check
        if: ${{ !cancelled() }}
        working-directory: web
        run: npm run check

      - name: Web - tests
        if: ${{ !cancelled() }}
        working-directory: web
        run: npm test

      - name: Web - build
        if: ${{ !cancelled() }}
        working-directory: web
        run: npm run build

      - name: Go - compare failures with the baseline
        if: ${{ always() && hashFiles('go-test.json') != '' }}
        run: node tools/ci/compare-go-failures.mjs --json go-test.json --baseline docs/desktop/baseline-go-tests.txt


  go-race:
    # The race detector run, BLOCKING (BL-441a cleared the races it found; the run on 2026-11-22 reported none). It is part of the required `build` gate, so it holds the
    # promotion pull request and shows red on develop. It fails on any "WARNING: DATA RACE" and on any test failure that is not in
    # docs/desktop/baseline-go-tests.txt (Linux known failures) or docs/desktop/baseline-go-race.txt (tests whose timing or budget
    # does not hold under -race; a known-slow test goes there, a real race never does).
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Go - race detector (compared with the baselines)
        env:
          CGO_ENABLED: "1"
        run: |
          set +e
          go test -race -count=1 -timeout 25m -skip '^TestRunHost(KeepsRecordingWhenThePortIsBusyAndTakesItLater|StopWhileWaitingForAPortReturns)$' -json ./... > go-race.json
          code=$?
          echo "go test -race exit code: $code"
          if [ ! -s go-race.json ]; then echo "::error::go test -race produced no JSON"; exit 1; fi
          if [ "$code" -gt 1 ]; then exit "$code"; fi
          bad=0
          races=$(grep -c 'WARNING: DATA RACE' go-race.json)
          echo "data races reported: $races"
          if [ "$races" -gt 0 ]; then echo "::error::The race detector reported $races data race(s)."; grep -m5 'DATA RACE' go-race.json | cut -c1-300; bad=1; fi
          cat docs/desktop/baseline-go-tests.txt docs/desktop/baseline-go-race.txt > race-baseline.txt
          node tools/ci/compare-go-failures.mjs --json go-race.json --baseline race-baseline.txt || bad=1
          exit $bad

      # The JSON holds the output of every test, so a new failure can be read (the log shows only its name).
      - name: Keep the race run output when it fails
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-race-json
          path: go-race.json
          retention-days: 7


  powershell-syntax:
    # The release and install scripts are PowerShell nobody can run on every push. This at least proves each one parses:
    # in PowerShell 7 (release scripts) and in Windows PowerShell 5.1 (tools/dev, which must run on a stock PC).
    # RV-CI-1: skipped for a notes-only pull request. A changed .ps1 file is never notes (the `changes` job counts every path outside
    # .forge/, docs/, root *.md, LICENSE and NOTICE as code), so a script change still runs this job. Not a required check.
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse every script in PowerShell 7
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Recurse -Include *.ps1 -Path tools, build.ps1, build-blackbox.ps1, run.ps1 -ErrorAction SilentlyContinue) {
            $errs = $null; $null = [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            if ($errs) { $bad++; $errs | ForEach-Object { Write-Host "$($f.FullName):$($_.Extent.StartLineNumber): $($_.Message)" } }
          }
          if ($bad) { throw "$bad script(s) do not parse." }

      - name: Proton Pass reader self-test (fake pass-cli, failure paths)
        shell: pwsh
        run: ./tools/release/Test-ProtonPass.ps1

      - name: Set up Go (the self-test lists the signing tool's dependencies)
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Release manager self-test (keys, versions, audit chain, no-prompt rules)
        shell: pwsh
        run: ./tools/release/Test-ReleaseManager.ps1

      - name: Parse tools/dev in Windows PowerShell 5.1
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Recurse -Include *.ps1 -Path tools\dev) {
            $errs = $null; $null = [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            if ($errs) { $bad++; $errs | ForEach-Object { Write-Host "$($f.FullName):$($_.Extent.StartLineNumber): $($_.Message)" } }
          }
          if ($bad) { throw "$bad script(s) do not parse." }
