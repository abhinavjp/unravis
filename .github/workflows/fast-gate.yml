name: Fast gate

# The check for pull requests into `develop` (the release train, see docs/ci/RELEASE-TRAIN.md).
# Full CI (ci.yml: Windows tests, race, exe build, screenshots, docs) does NOT run per pull request any more:
# it runs on every push to develop (the newest one wins) and on the pull request that promotes develop to master.
#
# The required status check is the job named `build`, same name as in ci.yml, so one branch-protection rule shape fits both:
#   go     scope (tools/ci/fast-scope.mjs: the changed packages plus every package that imports them), gofmt of changed
#          files, go vet on Linux and cross-vet for Windows, tests of those packages on Linux compared with the Linux
#          failure baseline, go mod tidy when go.mod or go.sum changed, the action-pin check.
#   web    only when web/ changed: type check, tests, build and the committed-build check (BL-031).
#   lint   golangci-lint on the new code only. Advisory, like the lint step in ci.yml's linux-gates: not part of `build`.
#   build  the gate: passes only when go and web passed.
# Not in this gate (it is in the full run on develop and on promotion): Windows tests, the race run, the exe build,
# screenshots, the docs check, govulncheck, osv, the desktop shell. See "What the fast gate does not check" in the spec.
# A push to develop runs the same job once to compile everything and save the Go cache, so pull requests start warm.
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: fast-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned to a full commit SHA (see ci.yml for how to update one).
      - name: Check out the code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The checked-out commit of a pull request is the merge with develop; its first parent is the develop tip.
          fetch-depth: 2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.5'

      - name: Go build cache - where and which week
        id: cachekey
        run: |
          echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Go build cache - restore
        id: gocache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ steps.cachekey.outputs.dir }}
            ~/go/pkg/mod
          key: fast-go-${{ hashFiles('go.sum') }}-${{ steps.cachekey.outputs.week }}
          restore-keys: |
            fast-go-${{ hashFiles('go.sum') }}-
            fast-go-

      - name: Checks that always run (tests of the CI tools, action pins)
        run: |
          set -euo pipefail
          node tools/ci/test-fast-scope.mjs
          node tools/ci/test-compare.mjs
          node tools/security/check-action-pins.mjs

      - name: Scope - what does this change affect?
        id: scope
        if: ${{ github.event_name == 'pull_request' }}
        run: node tools/ci/fast-scope.mjs --base HEAD^1 --head HEAD

      - name: Go - formatting of changed files
        if: ${{ github.event_name == 'pull_request' && steps.scope.outputs.gofiles != '' }}
        env:
          FILES: ${{ steps.scope.outputs.gofiles }}
        run: |
          set -euo pipefail
          # Judged on the committed text, like ci.yml. Older files on master that are not gofmt-clean are a separate pass (BL-032).
          unformatted=()
          for f in $FILES; do
            out="$(git show "HEAD:$f" | gofmt -l)"
            [ -z "$out" ] || unformatted+=("$f")
          done
          if [ "${#unformatted[@]}" -gt 0 ]; then
            echo "::error::These Go files changed by this pull request are not gofmt-clean:"
            printf '  %s\n' "${unformatted[@]}"
            echo "Run gofmt -w on them and commit."
            exit 1
          fi
          echo "All changed Go files are gofmt-clean."

      - name: Go - vet (Linux) and cross-vet (Windows) of the affected packages
        if: ${{ github.event_name == 'pull_request' && steps.scope.outputs.go == 'true' }}
        env:
          PACKAGES: ${{ steps.scope.outputs.packages }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          go vet $PACKAGES
          # Compiles the Windows-only files too (a Windows test cannot run here, but a Windows compile error is caught).
          # shellcheck disable=SC2086
          GOOS=windows go vet $PACKAGES

      - name: Go - tests of the affected packages (Linux, compared with the baseline)
        if: ${{ github.event_name == 'pull_request' && steps.scope.outputs.go == 'true' }}
        env:
          CGO_ENABLED: "0"
          PACKAGES: ${{ steps.scope.outputs.packages }}
        run: |
          set +e
          # Same rules as the linux-gates job of ci.yml: the baseline holds the known Windows-only failures, so go test
          # exits 1 on a normal run; the compare below is the pass/fail. The two skipped tests hang on Linux.
          # shellcheck disable=SC2086
          go test -count=1 -timeout 10m -skip '^TestRunHost(KeepsRecordingWhenThePortIsBusyAndTakesItLater|StopWhileWaitingForAPortReturns)$' -json $PACKAGES > go-test.json
          code=$?
          echo "go test exit code: $code"
          if [ ! -s go-test.json ]; then echo "go test produced no JSON"; exit 1; fi
          if [ "$code" -gt 1 ]; then exit "$code"; fi
          node tools/ci/compare-go-failures.mjs --json go-test.json --baseline docs/desktop/baseline-go-tests.txt

      - name: Go - modules are tidy
        if: ${{ github.event_name == 'pull_request' && steps.scope.outputs.go == 'true' }}
        run: |
          set -euo pipefail
          if git diff --name-only HEAD^1 HEAD | grep -Eq '^go\.(mod|sum)$'; then
            go mod tidy
            git diff --exit-code go.mod go.sum
          else
            echo "go.mod and go.sum are not changed by this pull request."
          fi

      - name: Go - compile everything and warm the cache (push to develop only)
        if: ${{ github.event_name == 'push' }}
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go vet ./...
          GOOS=windows go vet ./...
          # Compiles every test binary without running a test, so a pull request that tests a few packages finds them built.
          go test -count=1 -run '^$' ./...

      - name: Go build cache - save (push to develop only)
        if: ${{ success() && github.event_name == 'push' && steps.gocache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ steps.cachekey.outputs.dir }}
            ~/go/pkg/mod
          key: fast-go-${{ hashFiles('go.sum') }}-${{ steps.cachekey.outputs.week }}

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - name: Did the pull request touch web/?
        id: scope
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then echo "web=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          files="$(git diff --no-renames --name-only HEAD^1 HEAD)"
          # An empty diff is a doubt: run it. docs/user/*.md is read by the web build (BL-031).
          if [ -z "$files" ] || printf '%s\n' "$files" | grep -Eq '^(web/|docs/user/|cmd/unravis-(setup|lite)/ui/)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"; echo "No web files changed: skipping the web checks."
          fi

      - name: Set up Node
        if: ${{ steps.scope.outputs.web == 'true' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.5'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web - install
        if: ${{ steps.scope.outputs.web == 'true' }}
        working-directory: web
        run: npm ci

      - name: Web - type check
        if: ${{ steps.scope.outputs.web == 'true' && !cancelled() }}
        working-directory: web
        run: npm run check

      - name: Web - tests
        if: ${{ steps.scope.outputs.web == 'true' && !cancelled() }}
        working-directory: web
        run: npm test

      - name: Web - build
        if: ${{ steps.scope.outputs.web == 'true' && !cancelled() }}
        working-directory: web
        run: npm run build

      - name: Web - built files match what is committed
        # BL-031. Fails when `npm run build` gives bytes other than the committed web/dist,
        # cmd/unravis-setup/ui and cmd/unravis-lite/ui. Fix: run `npm run build` in web and commit them.
        if: ${{ steps.scope.outputs.web == 'true' && !cancelled() }}
        working-directory: web
        run: node scripts/check-dist.cjs

  lint:
    # Advisory (not part of `build`), like the lint step of linux-gates in ci.yml. Only code the pull request adds is judged.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      - name: Go - install golangci-lint
        # Built with the module's Go, not downloaded: the released binaries refuse a module on a newer Go (see ci.yml).
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: Go - lint (only code changed since develop)
        run: golangci-lint run --new-from-rev="origin/${GITHUB_BASE_REF}"

  build:
    # The gate. Branch protection on develop asks for this name and nothing else.
    needs: [go, web]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Everything the fast gate runs passed
        env:
          GO: ${{ needs.go.result }}
          WEB: ${{ needs.web.result }}
        run: |
          echo "go=$GO web=$WEB"
          if [ "$GO" != "success" ] || [ "$WEB" != "success" ]; then
            echo "::error::A fast-gate job did not pass (go=$GO, web=$WEB)."
            exit 1
          fi
