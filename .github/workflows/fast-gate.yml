name: Fast gate

# The check for pull requests into `develop` (the release train, see docs/ci/RELEASE-TRAIN.md).
# Full CI (ci.yml: Windows tests, race, exe build, screenshots, docs) does NOT run per pull request any more:
# it runs on every push to develop (the newest one wins) and on the pull request that promotes develop to master.
#
# The required status check on develop is the job named `fast-build`. It is NOT called `build`: the promotion pull request into
# master runs ci.yml's `build`, and two checks with one name on one commit could be mixed up (review of PR 126). One list per job:
#   go     scope (tools/ci/fast-scope.mjs: the changed packages plus every package that imports them), gofmt of changed
#          files, go vet on Linux and cross-vet for Windows, tests of those packages on Linux compared with the Linux
#          failure baseline, go mod tidy when go.mod or go.sum changed, the action-pin check.
#   web    only when web/ changed: type check, tests and build (the build must succeed). It does NOT compare the build with committed
#          files: pull requests into develop do not commit web/dist, cmd/unravis-setup/ui or cmd/unravis-lite/ui (they would conflict on
#          nearly every merge). The promotion rebuilds and commits them once; check-dist runs there (ci.yml, release.yml).
#          A cheap guard step fails a pull request that does change those folders (except a back-merge that makes them equal master's). See docs/pipeline/dist-on-promotion.md.
#   lint   golangci-lint on the new code only. Advisory, like the lint step in ci.yml's linux-gates: not part of `build`.
#   fast-build  the gate: passes only when go and web passed.
# Not in this gate (it is in the full run on develop and on promotion): Windows tests, the race run, the exe build,
# screenshots, the docs check, govulncheck, osv, the desktop shell. See "What the fast gate does not check" in the spec.
# A push to develop runs the same job once to compile everything and save the Go cache, so pull requests start warm.
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: fast-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned to a full commit SHA (see ci.yml for how to update one).
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The checked-out commit of a pull request is the merge with develop; its first parent is the develop tip.
          fetch-depth: 2

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'

      - name: Go build cache - where and which week
        id: cachekey
        run: |
          echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Go build cache - restore
        id: gocache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.cachekey.outputs.dir }}
            ~/go/pkg/mod
          key: fast-go-${{ hashFiles('go.sum') }}-${{ steps.cachekey.outputs.week }}
          restore-keys: |
            fast-go-${{ hashFiles('go.sum') }}-
            fast-go-

      - name: Checks that always run (tests of the CI tools, action pins)
        run: |
          set -euo pipefail
          node tools/ci/test-fast-scope.mjs
          node tools/ci/test-compare.mjs
          node tools/ci/test-promote-dist.mjs
          node tools/security/check-action-pins.mjs

      - name: Scope - what does this change affect?
        id: scope
        if: ${{ github.event_name == 'pull_request' }}
        run: node tools/ci/fast-scope.mjs --base HEAD^1 --head HEAD

      - name: Go - formatting of changed files
        if: ${{ github.event_name == 'pull_request' && steps.scope.outputs.gofiles != '' }}
        run: |
          set -euo pipefail
          # Judged on the committed text, like ci.yml. Older files on master that are not gofmt-clean are a separate pass (BL-032).
          # The list is read line by line from git (a name with a space is one name); deleted files are left out.
          unformatted=()
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            out="$(git show "HEAD:$f" | gofmt -l)"
            [ -z "$out" ] || unformatted+=("$f")
          done < <(git diff --no-renames --diff-filter=d --name-only HEAD^1 HEAD -- '*.go')
          if [ "${#unformatted[@]}" -gt 0 ]; then
            echo "::error::These Go files changed by this pull request are not gofmt-clean:"
            printf '  %s\n' "${unformatted[@]}"
            echo "Run gofmt -w on them and commit."
            exit 1
          fi
          echo "All changed Go files are gofmt-clean."

      - name: Go - vet (Linux) and cross-vet (Windows) of the affected packages
        if: ${{ github.event_name == 'pull_request' && steps.scope.outputs.go == 'true' }}
        env:
          PACKAGES: ${{ steps.scope.outputs.packages }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          go vet $PACKAGES
          # Compiles the Windows-only files too (a Windows test cannot run here, but a Windows compile error is caught).
          # shellcheck disable=SC2086
          GOOS=windows go vet $PACKAGES

      - name: Go - tests of the affected packages (Linux, compared with the baseline)
        if: ${{ github.event_name == 'pull_request' && steps.scope.outputs.go == 'true' }}
        env:
          CGO_ENABLED: "0"
          PACKAGES: ${{ steps.scope.outputs.packages }}
        run: |
          set +e
          # Same rules as the linux-gates job of ci.yml: the baseline holds the known Windows-only failures, so go test
          # exits 1 on a normal run; the compare below is the pass/fail. The two skipped tests hang on Linux.
          # shellcheck disable=SC2086
          go test -count=1 -timeout 10m -skip '^TestRunHost(KeepsRecordingWhenThePortIsBusyAndTakesItLater|StopWhileWaitingForAPortReturns)$' -json $PACKAGES > go-test.json
          code=$?
          echo "go test exit code: $code"
          if [ ! -s go-test.json ]; then echo "go test produced no JSON"; exit 1; fi
          if [ "$code" -gt 1 ]; then exit "$code"; fi
          node tools/ci/compare-go-failures.mjs --json go-test.json --baseline docs/desktop/baseline-go-tests.txt

      - name: Go - modules are tidy
        if: ${{ github.event_name == 'pull_request' && steps.scope.outputs.go == 'true' }}
        run: |
          set -euo pipefail
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          if grep -Eq '^go\.(mod|sum)$' "$RUNNER_TEMP/changed.txt"; then
            go mod tidy
            git diff --exit-code go.mod go.sum
          else
            echo "go.mod and go.sum are not changed by this pull request."
          fi

      - name: Go - compile everything and warm the cache (push to develop only)
        if: ${{ github.event_name == 'push' }}
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go vet ./...
          GOOS=windows go vet ./...
          # Compiles every test binary without running a test, so a pull request that tests a few packages finds them built.
          go test -count=1 -run '^$' ./...

      - name: Go build cache - save (push to develop only)
        if: ${{ success() && github.event_name == 'push' && steps.gocache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.cachekey.outputs.dir }}
            ~/go/pkg/mod
          key: fast-go-${{ hashFiles('go.sum') }}-${{ steps.cachekey.outputs.week }}

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Generated web files are not part of this pull request
        # Policy (docs/pipeline/dist-on-promotion.md): the promotion rebuilds and commits web/dist, cmd/unravis-setup/ui and
        # cmd/unravis-lite/ui. A pull request that changes them would conflict with the promotion's rebuild. The one allowed case is a
        # back-merge of master into develop (a hotfix, or the fix for a promotion conflict): there the three folders, as they are after
        # the merge, must be byte for byte master's. That is a rule about content, not about a branch name or an author, so a pull
        # request cannot get through with other files in those folders.
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          # Names are matched case-insensitively (a Windows checkout would put cmd/unravis-setup/UI/x.js inside the embedded ui folder).
          pattern='^(web/dist|cmd/unravis-(setup|lite)/ui)/'
          bad="$(git diff --no-renames --name-only HEAD^1 HEAD | grep -iE "$pattern" || true)"
          if [ -z "$bad" ]; then echo "No generated web files in this pull request."; exit 0; fi
          # A back-merge of master is the one allowed case: after the merge the generated files must be master's, exactly (same names,
          # same bytes, same letter case). The listing below includes every case variant, so one that master lacks cannot pass.
          git fetch --no-tags --depth=1 origin master
          differ="$(git diff --no-renames --name-only FETCH_HEAD HEAD | grep -iE "$pattern" || true)"
          if [ -z "$differ" ]; then
            echo "The generated web folders equal master's (a back-merge of master): allowed."
            exit 0
          fi
          echo "::error::This pull request changes generated web files. Do not commit them: the promotion to master rebuilds them (docs/pipeline/dist-on-promotion.md)."
          { printf '%s\n' "$bad" | head -20 | sed 's/^/  /'; } || true
          echo "Restore them (this also deletes the new hashed files; a plain checkout would not):"
          echo "  git restore --source=origin/develop --staged --worktree -- web/dist cmd/unravis-setup/ui cmd/unravis-lite/ui"
          echo "  git clean -fd -- web/dist cmd/unravis-setup/ui cmd/unravis-lite/ui     (removes files git did not track yet; check git status first)"
          echo "A back-merge of master into develop is allowed only when these folders end up identical to master's: the same two commands with --source=origin/master."
          exit 1

      - name: Did the pull request touch web/?
        id: scope
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then echo "web=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          files="$(git diff --no-renames --name-only HEAD^1 HEAD)"
          # An empty diff is a doubt: run it. docs/user/*.md is read by the web build (BL-031).
          if [ -z "$files" ] || printf '%s\n' "$files" | grep -Eq '^(web/|docs/user/|internal/(server|blackbox|calltrace)/|tools/e2e/)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"; echo "No web files changed: skipping the web checks."
          fi

      - name: Set up Node
        if: ${{ steps.scope.outputs.web == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web - install
        if: ${{ steps.scope.outputs.web == 'true' }}
        working-directory: web
        run: npm ci

      - name: Web - type check
        if: ${{ steps.scope.outputs.web == 'true' && !cancelled() }}
        working-directory: web
        run: npm run check

      - name: Web - tests
        if: ${{ steps.scope.outputs.web == 'true' && !cancelled() }}
        working-directory: web
        run: npm test

      - name: Web - build
        if: ${{ steps.scope.outputs.web == 'true' && !cancelled() }}
        working-directory: web
        run: npm run build

  lint:
    # Advisory (not part of `build`), like the lint step of linux-gates in ci.yml. Only code the pull request adds is judged.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Go - install golangci-lint
        # Built with the module's Go, not downloaded: the released binaries refuse a module on a newer Go (see ci.yml).
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: Go - lint (only code changed since develop)
        run: golangci-lint run --new-from-rev="origin/${GITHUB_BASE_REF}"

  fast-build:
    # The gate. Branch protection on develop asks for this name and nothing else.
    needs: [go, web]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Everything the fast gate runs passed
        env:
          GO: ${{ needs.go.result }}
          WEB: ${{ needs.web.result }}
        run: |
          echo "go=$GO web=$WEB"
          if [ "$GO" != "success" ] || [ "$WEB" != "success" ]; then
            echo "::error::A fast-gate job did not pass (go=$GO, web=$WEB)."
            exit 1
          fi
