name: UI audit

# Opens every screen of the demo app in dark and light, at desktop and phone width, checks the layout and
# writes tools/uiaudit/report/REPORT.md with screenshots. About 20 minutes, so it is NOT a check on every pull request:
# it runs on pull requests that change the audit itself (tools/uiaudit, this file), by hand (Actions, UI audit, Run workflow)
# and weekly. The verdict is in the job summary; the whole report is the artifact "ui-audit-report-<os>".
# Runs on Linux and on Windows (the reference renderer of the screenshots, and where Windows-only screens can be reached).
# See tools/uiaudit/README.md.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  pull_request:
    paths:
      - 'tools/uiaudit/**'
      - '.github/workflows/ui-audit.yml'

permissions:
  contents: read

concurrency:
  group: ui-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
          cache: npm
          cache-dependency-path: |
            tools/uiaudit/package-lock.json
            web/package-lock.json

      - name: Build the web files from the current source
        # Pull requests into develop do not commit web/dist, cmd/unravis-setup/ui and cmd/unravis-lite/ui (docs/pipeline/dist-on-promotion.md),
        # and the audit builds its demo exe with `go build`, which embeds them. Without this step it would audit the last promoted UI.
        # The files are built in the working copy only and never committed.
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install the audit tools and Chromium
        working-directory: tools/uiaudit
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Checker tests
        working-directory: tools/uiaudit
        run: |
          npm test
          npm run selftest

      - name: Strict-CSP run (BL-323)
        # The demo app's pages under the desktop window's policy: any securitypolicyviolation fails. See tools/uiaudit/README.md.
        working-directory: tools/uiaudit
        run: |
          go build -o ../../.csp-demo.exe ../../cmd/audit-explorer
          UNRAVIS_EXE="$(cd ../.. && pwd)/.csp-demo.exe" npm run csp

      - name: Run the audit
        id: audit
        # A failed CSP step must not hide the audit report of the same run.
        if: ${{ !cancelled() }}
        working-directory: tools/uiaudit
        run: node run-audit.mjs

      - name: Verdict in the job summary
        if: ${{ always() }}
        working-directory: tools/uiaudit
        run: |
          if [ -f report/REPORT.md ]; then
            sed -n '1,/^## Problems by kind/p' report/REPORT.md | head -n -1 >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The audit did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-audit-report-${{ matrix.os }}
          path: |
            tools/uiaudit/report/REPORT.md
            tools/uiaudit/report/summary.json
            tools/uiaudit/report/shots
            tools/uiaudit/report/data
          retention-days: 30
