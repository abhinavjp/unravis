# After a release is PUBLISHED and its feed updated, prove on a clean Windows runner that real users get it:
# the public feed names it, the release verifies offline, tampered copies are refused, the previous release
# sees it with --check-update, upgrades to it, cannot be forced back, and a standalone Blackbox service updates itself.
# Reads public data only. Needs no secret and publishes nothing. Started by hand, or by tools/release/Release.ps1.
name: verify-release
# The nonce makes each run findable by the script that started it (Release.ps1 matches on it).
run-name: verify-release ${{ inputs.tag }} ${{ inputs.nonce }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published tag to verify (vX.Y.Z or vX.Y.Z-rc.N)'
        required: true
        type: string
      previous:
        description: 'Older published tag to upgrade from (leave empty for the first signed release)'
        required: false
        type: string
      nonce:
        description: 'Id that Release.ps1 puts in the run name to find this run (leave empty when starting by hand)'
        required: false
        default: ''
        type: string
      wait_minutes:
        description: 'Minutes to wait for the standalone recorder to update itself'
        required: false
        default: '12'
        type: string

permissions:
  contents: read

jobs:
  # Two machines at once. The recorder test (B5) mostly waits for the recorder's own first update check (1 to 5 minutes) and shares
  # nothing with the other steps, so it gets its own runner; the run passes only if both jobs pass (Release.ps1 reads the run's result).
  verify:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out the code at the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Verify the published release (feed, offline check, tamper refusals, upgrade, no downgrade)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PREVIOUS: ${{ inputs.previous }}
        run: |
          $a = @{ Tag = $env:INPUT_TAG; Part = 'Main' }
          if ($env:INPUT_PREVIOUS) { $a.Previous = $env:INPUT_PREVIOUS }
          ./tools/release/Invoke-VerifyRelease.ps1 @a

  recorder:
    runs-on: windows-2022
    timeout-minutes: 45
    # Nothing to test without an older release to start from (the very first signed release).
    if: ${{ inputs.previous != '' }}
    steps:
      - name: Check out the code at the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Verify the standalone recorder updates itself
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PREVIOUS: ${{ inputs.previous }}
          INPUT_WAIT: ${{ inputs.wait_minutes }}
        run: |
          ./tools/release/Invoke-VerifyRelease.ps1 -Tag $env:INPUT_TAG -Previous $env:INPUT_PREVIOUS -WaitMinutes ([int]$env:INPUT_WAIT) -Part Recorder
