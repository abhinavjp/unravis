name: Release

# Runs when a tag matching vX.Y.Z (or vX.Y.Z-pre.N) is pushed. Tags without the "v" prefix never
# match this trigger, so they never start a release. workflow_dispatch lets a person re-run a
# release for a tag that already exists (see the "draft" job: a re-run replaces the assets of an
# existing DRAFT and refuses a published release).
#
# This workflow never publishes anything. The "draft" job only ever creates or updates a DRAFT
# release. A person presses Publish by hand after the smoke job is green (see
# buildout/plan/installer-and-releases.md sections 9 to 11).
#
# Third-party actions are pinned to a full commit SHA, the same convention as ci.yml. To update
# one, look up the new SHA (git ls-remote https://github.com/actions/<name>.git refs/tags/<tag>)
# and change both the SHA and the tag comment.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and draft a release for (e.g. v1.0.0 or v1.0.0-rc.1). The tag must already exist.'
        required: true

permissions:
  contents: read

concurrency:
  # Keyed by tag, not by ref, so two different tags build in parallel but the same tag never does.
  group: release-${{ github.workflow }}-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
      # Reads the result of CI on this commit (the step "Did CI already pass").
      actions: read
      # Build attestation (docs/auto-updater/SPEC.md U1b): GitHub signs "this workflow, at this commit, built these files".
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      # No checkout is needed yet: the tag name comes from the trigger event, not the tree.
      - name: Resolve and validate the release tag
        id: tag
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_TAG } else { $env:REF_NAME }
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') {
            throw "Tag '$tag' does not look like vX.Y.Z or vX.Y.Z-pre.N (installer-and-releases.md section 9). A tag without the v prefix never reaches this workflow."
          }
          $version = $tag.Substring(1)
          Write-Host "Releasing $tag (version $version)"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Decide whether signing is enabled
        id: signgate
        shell: pwsh
        env:
          # The secrets context cannot be read in a step "if", so only this step sees the secret
          # and passes on a plain true/false.
          SIGNPATH_SET: ${{ secrets.SIGNPATH != '' }}
        run: |
          "enabled=$($env:SIGNPATH_SET.ToLower())" >> $env:GITHUB_OUTPUT

      - name: Check out the code at the tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0 # full history: the notes generator walks git log back to the previous tag

      - name: Did CI already pass on this exact commit?
        id: ci
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tests below are the same ones ci.yml runs on every master commit, and Release.ps1 tags only a commit whose CI is green.
          # Running them again here cost about 7 of the 11 minutes. They are skipped only when the NEWEST ci.yml run for this exact
          # commit on master succeeded (the same rule Release.ps1 uses); a tag on any other commit, or with no green CI, runs them all.
          # Nothing that is built, attested or signed depends on this: the compile steps below always run.
          $skip = 'false'
          $sha = (git rev-parse HEAD).Trim()   # the commit checked out above (a manual re-run starts on master, but builds the tag)
          $json = gh run list --repo $env:GITHUB_REPOSITORY --workflow ci.yml --commit $sha --branch master --event push --limit 10 --json databaseId,status,conclusion
          if ($LASTEXITCODE -eq 0 -and $json) {
            $last = @(($json -join "`n") | ConvertFrom-Json) | Sort-Object { [long]$_.databaseId } -Descending | Select-Object -First 1
            if ($last -and $last.status -eq 'completed' -and $last.conclusion -eq 'success') { $skip = 'true'; Write-Host "CI run $($last.databaseId) passed on this commit: tests are skipped here." }
          }
          if ($skip -ne 'true') { Write-Host 'No green CI run found for this commit: running every test here.' }
          $global:LASTEXITCODE = 0   # a failed gh call above is handled (tests run); it must not fail this step
          "tests_done=$skip" >> $env:GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web - install
        working-directory: web
        run: npm ci

      - name: Web - type check
        if: ${{ steps.ci.outputs.tests_done != 'true' }}
        working-directory: web
        run: npm run check

      - name: Web - tests
        if: ${{ steps.ci.outputs.tests_done != 'true' }}
        working-directory: web
        run: npm test

      - name: Web - build
        working-directory: web
        run: npm run build

      - name: Go - vet
        if: ${{ steps.ci.outputs.tests_done != 'true' }}
        run: go vet ./...

      - name: Go - tests
        if: ${{ steps.ci.outputs.tests_done != 'true' }}
        run: go test -p 2 -timeout 25m ./...

      - name: Release scripts - checksum self-test
        if: ${{ steps.ci.outputs.tests_done != 'true' }}
        shell: pwsh
        run: ./tools/release/Test-Release.ps1

      - name: Build the programs and the installer
        # The web step above already built web/dist, so it is skipped here (same as ci.yml); the Go tests step above already ran go test, so -SkipTests.
        # build.ps1 also builds the keeper, the Blackbox and the installer with its embedded payload.
        # -Release makes build.ps1 build the Blackbox first and pin the app to its SHA-256 (SEC-FIX-01); it fails on an empty pin.
        shell: pwsh
        run: |
          ./build.ps1 -SkipWeb -SkipTests -Release -Version "${{ steps.tag.outputs.version }}"
          Copy-Item -LiteralPath 'dist/unravis-setup.exe' -Destination "dist/unravis-setup-v${{ steps.tag.outputs.version }}-windows-x64.exe" -Force

      - name: Build dist\unravis-blackbox.exe and its zip
        # The Blackbox is built once, by build.ps1 (with -trimpath and -X main.version), and the app is pinned to
        # its SHA-256. -Reuse packs those same bytes, so the zip's exe is the one the app accepts as its helper
        # (SEC-FIX-01). A rebuild here would give a different file and break the pin.
        run: ./build-blackbox.ps1 -Reuse -Version "${{ steps.tag.outputs.version }}"

      # When SignPath signing is wired up, sign unravis-blackbox.exe BEFORE the pin is computed and
      # unravis.exe is built. Signing it afterwards changes its bytes and the app's pin (the helper
      # hash check) would then refuse it on every elevation.
      - name: Check the app is pinned to the packed Blackbox
        shell: pwsh
        run: |
          $sha = (Get-FileHash -LiteralPath 'dist/unravis-blackbox.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -notmatch '^[0-9a-f]{64}$') { throw 'The Blackbox hash is empty.' }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path 'dist/unravis.exe').Path)
          $text = [System.Text.Encoding]::GetEncoding(28591).GetString($bytes)
          if (-not $text.Contains($sha)) { throw "dist/unravis.exe is not pinned to dist/unravis-blackbox.exe ($sha). A release must not ship an unpinned app." }
          Write-Host "unravis.exe is pinned to unravis-blackbox.exe $sha"

      - name: Sign the binaries (SignPath)
        # Skipped entirely unless the SIGNPATH secret is set (see the signgate step). Until the
        # SignPath client call is wired up, setting the secret fails the build instead of shipping
        # unsigned files under a signed notice (installer-and-releases.md section 8).
        if: ${{ steps.signgate.outputs.enabled == 'true' }}
        shell: pwsh
        run: |
          # %0A is how a workflow annotation carries a line break.
          $lines = @(
            'The SIGNPATH repository secret is set, but this workflow has no SignPath signing step yet, so nothing was signed and the build is stopped on purpose.',
            'Shipping now would mark the release as signed when it is not.',
            'The owner must do ONE of these, then re-run this workflow (Actions > Release > Run workflow, enter the same tag):',
            '1. Ship unsigned: delete the SIGNPATH secret (repository Settings > Secrets and variables > Actions > Repository secrets). The notes then carry the "not signed" notice.',
            '2. Ship signed: add the SignPath signing step (buildout/plan/installer-and-releases.md section 8) so it signs dist/unravis-setup.exe, dist/unravis.exe, dist/unravis-blackbox.exe and dist/unravis-lite.exe before packaging, and set SIGNED to true in the "Write the release notes" step.'
          )
          Write-Host ('::error title=SignPath is set but signing is not wired up::' + ($lines -join '%0A'))
          $lines | ForEach-Object { Write-Host $_ }
          exit 1

      - name: Package the portable zip
        shell: pwsh
        run: |
          $Version = '${{ steps.tag.outputs.version }}'
          $Stage = 'dist/portable-pack'
          if (Test-Path -LiteralPath $Stage) { Remove-Item -LiteralPath $Stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $Stage | Out-Null
          Copy-Item -LiteralPath 'dist/unravis.exe' -Destination $Stage
          # Picked up automatically once a LICENSE file exists at the repo root; there is none today.
          Get-ChildItem -LiteralPath '.' -Filter 'LICENSE*' -File -ErrorAction SilentlyContinue | Copy-Item -Destination $Stage
          # A plain array (not a here-string): a here-string's closing '@ has to sit at column 0,
          # which this YAML block literal's indentation would break.
          $Readme = @(
            'Unravis',
            '=======',
            '',
            'Unravis reads audit logs and server health so an incident can be',
            'reconstructed after the fact. It never changes the servers it reads.',
            '',
            'Run',
            '---',
            '    unravis.exe',
            '',
            'It opens your browser to a local dashboard (loopback only; nothing is',
            'exposed on the network). Use --no-browser to get a one-time link to open',
            'by hand, and --help for the full list of options.',
            '',
            'Verify your download',
            '---------------------',
            "Compare this file's hash with the matching line in SHA256SUMS.txt from the",
            'same release:',
            '    Get-FileHash .\unravis.exe -Algorithm SHA256'
          )
          $Readme | Set-Content -Encoding utf8 (Join-Path $Stage 'README.txt')
          $Zip = "dist/unravis-v$Version-windows-x64.zip"
          if (Test-Path -LiteralPath $Zip) { Remove-Item -LiteralPath $Zip -Force }
          Compress-Archive -Path (Join-Path $Stage '*') -DestinationPath $Zip -CompressionLevel Optimal
          Remove-Item -LiteralPath $Stage -Recurse -Force

      - name: Package Unravis Lite
        shell: pwsh
        run: |
          $Version = '${{ steps.tag.outputs.version }}'
          $Stage = 'dist/lite-pack'
          if (Test-Path -LiteralPath $Stage) { Remove-Item -LiteralPath $Stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $Stage | Out-Null
          Copy-Item -LiteralPath 'dist/unravis-lite.exe' -Destination $Stage
          Get-ChildItem -LiteralPath '.' -Filter 'LICENSE*' -File -ErrorAction SilentlyContinue | Copy-Item -Destination $Stage
          Get-ChildItem -LiteralPath '.' -Filter 'NOTICE*' -File -ErrorAction SilentlyContinue | Copy-Item -Destination $Stage
          $Readme = @(
            'Unravis Lite',
            '============',
            '',
            'A small viewer for one Blackbox. It reads the recordings and shows the charts.',
            'It changes nothing, saves nothing and sends nothing anywhere.',
            '',
            'Run (as an administrator if the recordings folder is locked):',
            '    unravis-lite.exe',
            '',
            'It finds the Blackbox on this PC and prints a one-time link to a local page',
            '(loopback only); open the link in your browser. To read a copy of the recordings, or a share:',
            '    unravis-lite.exe --folder D:\copy-of-recordings',
            'Add --open to open the link in the default browser for you.'
          )
          $Readme | Set-Content -Encoding utf8 (Join-Path $Stage 'README.txt')
          $Zip = "dist/unravis-lite-v$Version-windows-x64.zip"
          if (Test-Path -LiteralPath $Zip) { Remove-Item -LiteralPath $Zip -Force }
          Compress-Archive -Path (Join-Path $Stage '*') -DestinationPath $Zip -CompressionLevel Optimal
          Remove-Item -LiteralPath $Stage -Recurse -Force

      - name: Collect the release assets and write SHA256SUMS.txt
        id: assets
        shell: pwsh
        run: |
          # $Assets is the one list every later step (checksums, the artifact upload, the smoke
          # job, the draft job) reads from, instead of each recomputing its own file names.
          $Version = '${{ steps.tag.outputs.version }}'
          $Assets = @(
            "unravis-v$Version-windows-x64.zip",
            "unravis-blackbox-v$Version-windows-x64.zip",
            "unravis-lite-v$Version-windows-x64.zip",
            "unravis-setup-v$Version-windows-x64.exe"
          )
          foreach ($name in $Assets) {
            $path = Join-Path 'dist' $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing release asset: $path" }
          }
          # The unsigned update manifest (docs/auto-updater/SPEC.md section 5). CI signs nothing: the owner signs it on
          # their own PC (tools/release/Sign-Release.ps1) before pressing Publish. -seq must only ever go up: run number x 100 + attempt.
          $Commit = (git rev-parse HEAD).Trim()
          go run ./tools/release/sigtool manifest -dir dist -version "$Version" -commit $Commit -seq ([int64]${{ github.run_number }} * 100 + [int64]${{ github.run_attempt }}) -out dist/update-manifest.json
          if ($LASTEXITCODE -ne 0) { throw "sigtool manifest failed with exit code $LASTEXITCODE" }
          $Assets += 'update-manifest.json'
          ./tools/release/New-Sha256Sums.ps1 -AssetDir 'dist' -Names $Assets -OutFile 'dist/SHA256SUMS.txt'
          $Assets += 'SHA256SUMS.txt'
          ($Assets -join "`n") | Set-Content -Encoding utf8 'dist/ASSET-LIST.txt'

      - name: Write the release notes
        shell: pwsh
        env:
          # Becomes true only when the sign step really signs (it fails the build today).
          SIGNED: 'false'
          # The notes say "Not yet verified on a clean PC." unless this repository variable (Settings >
          # Secrets and variables > Actions > Variables) is the text true. Set it only after a person
          # has run the installer on a clean machine for this release.
          CLEAN_VM_VERIFIED: ${{ vars.CLEAN_VM_VERIFIED }}
        # The generator treats "no earlier tag" (the first release) as normal and lists the whole log.
        # The checkout above fetched all history and tags, which the previous-tag lookup needs.
        run: |
          ./tools/release/New-ReleaseNotes.ps1 `
            -Tag '${{ steps.tag.outputs.tag }}' `
            -Version '${{ steps.tag.outputs.version }}' `
            -TemplatePath '.github/release-notes-template.md' `
            -OutFile 'dist/RELEASE-NOTES.md' `
            -Signed:($env:SIGNED -eq 'true')

      - name: Attest the release files (built by this workflow from this commit)
        # Pinned to the commit of v2.4.0. Sign-Release.ps1 checks these attestations before the owner signs the manifest.
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/unravis-v*-windows-x64.zip
            dist/unravis-blackbox-v*-windows-x64.zip
            dist/unravis-lite-v*-windows-x64.zip
            dist/unravis-setup-v*-windows-x64.exe
            dist/update-manifest.json

      - name: Upload the release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          # Only the release files; dist also holds the loose programs, which are not assets.
          path: |
            dist/unravis-v*-windows-x64.zip
            dist/unravis-blackbox-v*-windows-x64.zip
            dist/unravis-lite-v*-windows-x64.zip
            dist/unravis-setup-v*-windows-x64.exe
            dist/update-manifest.json
            dist/SHA256SUMS.txt
            dist/ASSET-LIST.txt
            dist/RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 14

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out the code at the tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.build.outputs.tag }}

      - name: Download the release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: dist

      - name: Smoke test the release on a clean runner
        shell: pwsh
        run: ./tools/release/Invoke-Smoke.ps1 -AssetDir 'dist' -Tag '${{ needs.build.outputs.tag }}'

      - name: Keep the smoke log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-log-${{ matrix.os }}
          path: dist/smoke-*.log
          if-no-files-found: ignore
          retention-days: 14

  draft:
    # Gated on smoke: a release never reaches a draft until the installer has been proven to run
    # silently on both runner images. Publishing the draft is still a person, not this workflow.
    needs: [build, smoke]
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the code at the tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.build.outputs.tag }}

      - name: Download the release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: dist

      - name: Create or update the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ needs.build.outputs.tag }}'
          $names = Get-Content -LiteralPath 'dist/ASSET-LIST.txt' | Where-Object { $_.Trim() -ne '' }
          $assetPaths = $names | ForEach-Object { Join-Path 'dist' $_ }
          foreach ($p in $assetPaths) {
            if (-not (Test-Path -LiteralPath $p -PathType Leaf)) { throw "Missing asset to attach: $p" }
          }

          $isRc = $tag.Contains('-')
          # "gh release view <tag>" does not reliably find a draft (a draft has no public tag page), so
          # the lookup lists releases instead; the list includes drafts for a token with contents: write.
          # A failed listing stops the job rather than being read as "no such release".
          $listJson = gh release list --limit 200 --json tagName,isDraft
          if ($LASTEXITCODE -ne 0) { throw "gh release list failed with exit code $LASTEXITCODE" }
          $found = @(($listJson -join "`n") | ConvertFrom-Json | Where-Object { $_.tagName -eq $tag })
          if ($found.Count -gt 1) { throw "More than one release is listed for tag $tag. Delete the extra one by hand and re-run." }
          $exists = ($found.Count -eq 1)
          if ($exists) {
            $isDraft = [bool]$found[0].isDraft
            if (-not $isDraft) { throw "Release $tag is already published. Refusing to change a published release; delete it by hand first if you really mean to rebuild it." }
            Write-Host "Draft $tag exists. Replacing its assets and keeping its notes."
            # A re-run makes a new update-manifest.json. The owner's old signature no longer matches it, so drop it first
            # (a missing one is fine); it must be signed again.
            gh release delete-asset $tag update-manifest.json.sig --yes 2>$null
            $global:LASTEXITCODE = 0
            gh release upload $tag @assetPaths --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit code $LASTEXITCODE" }
          } else {
            $flags = @('--draft', '--verify-tag', '--title', $tag, '--notes-file', 'dist/RELEASE-NOTES.md')
            if ($isRc) { $flags += '--prerelease' }
            gh release create $tag @assetPaths @flags
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
          }
          Write-Host "Draft release $tag is ready. A person must press Publish; nothing here does that."
