name: Supply chain

# BL-335 (docs/desktop/spec/02-security.md). Checks known-bad dependencies, secrets and
# unpinned actions on every PR and push to master. Runs on ubuntu-24.04: nothing here
# is Windows specific, and the Windows release binary is cross-built for govulncheck.
#
# Pins: actions are pinned by 40-hex SHA (tag checked with git ls-remote, noted in the
# comment). Go tools are installed by exact module version (go.sum database verifies them).
#
# osv-scanner reads go.mod (it has no go.sum extractor).
#
# Not here yet: the cargo-deny job and desktop/src-tauri/deny.toml. They are added in the
# same PR that creates desktop/ (no Rust exists yet). Until then dependabot's cargo entry
# is inert. osv-scanner reads desktop/Cargo.lock; its waivers are in desktop/osv-scanner.toml.
on:
  # Pull requests into develop get the action-pin check in fast-gate.yml; the rest runs on the pull request that promotes
  # develop to master and on the push to master (docs/ci/RELEASE-TRAIN.md), not on every push to develop. "Run workflow" runs it by hand.
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  GOVULNCHECK_VERSION: v1.10.0
  OSV_SCANNER_VERSION: v2.7.1

jobs:
  pins:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Every action is pinned by SHA
        run: node tools/security/check-action-pins.mjs
      - name: Pin checker tests
        run: node --test tools/security/check-action-pins.test.mjs

  npm-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # min-release-age needs npm 11.10 or newer; Node 22 ships npm 10.
      - name: Newer npm (min-release-age support)
        run: npm install -g npm@11.21.3
      - name: Policy is active
        working-directory: web
        run: |
          age=$(npm config get min-release-age)
          scripts=$(npm config get ignore-scripts)
          echo "min-release-age=$age ignore-scripts=$scripts"
          [ "$age" = "3" ] && [ "$scripts" = "true" ] || { echo "web/.npmrc policy not in effect"; exit 1; }
      - name: Locked install with scripts off, then build
        working-directory: web
        run: |
          npm ci
          npm run build

  govulncheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # setup-go installs the go.mod version. Never let the go command swap in another
      # toolchain: govulncheck type-checks the standard library of the GOROOT it runs
      # under, and a mismatched toolchain gives "requires go1.26 or later" errors.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
      # The code base is Windows specific (internal/blackbox has no Linux build), so the
      # source scan type-checks as windows/amd64.
      - name: Source scan
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        # Blocking (BL-460): the one finding master had, GO-2026-6859 in net/http, is fixed by go 1.27.4 in go.mod.
        run: govulncheck ./...
      - name: Build the Windows release binary with the release flags
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -mod=readonly -trimpath -buildvcs=false -o "$RUNNER_TEMP/unravis.exe" ./cmd/audit-explorer
      - name: Binary scan
        run: govulncheck -mode=binary "$RUNNER_TEMP/unravis.exe"

  osv:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install osv-scanner
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@${OSV_SCANNER_VERSION}
      # The waivers in desktop/osv-scanner.toml rest on one fact: glib, proc-macro-error and chrono are not in the Windows build (the only one shipped).
      # If a Tauri bump ever pulls one in, this step fails instead of the advisory staying waived until its expiry date.
      - name: Waived Rust crates stay out of the Windows build
        working-directory: desktop
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          set -euo pipefail
          for crate in glib proc-macro-error chrono; do
            found="$(cargo tree --locked -i "$crate" --target x86_64-pc-windows-msvc -e all 2>/dev/null || true)"
            if [ -n "$found" ]; then
              echo "::error::$crate is now in the Windows build; its waiver in desktop/osv-scanner.toml no longer holds."
              echo "$found"
              exit 1
            fi
          done
      - name: Scan lockfiles
        # Blocking (BL-460a): a red check, nothing more (master requires only `build`). An osv.dev outage turns it red too; there is no retry yet.
        # The three Rust findings that exist today are waived with reasons and expiry dates in desktop/osv-scanner.toml.
        run: |
          args="-L go.mod -L web/package-lock.json"
          if [ -f desktop/Cargo.lock ]; then args="$args -L desktop/Cargo.lock"; fi
          osv-scanner scan source $args

  secrets:
    # Spec 02 2.11: PR diff only. A push to master was already scanned as a PR.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # verified (live) and unknown (could not be checked) as the spec says; the action
      # scans base..head of the PR. trufflehog v3.100.0 checked with git ls-remote.
      # --exclude-paths: a short list of Go test files that hold fake credentials on purpose (the scrubber tests);
      # one literal path per line, guarded by tools/ci/test-trufflehog-allowlist.mjs, see docs/ci/RELEASE-TRAIN.md (single lines: trufflehog:ignore tag).
      - name: trufflehog (verified and unknown)
        uses: trufflesecurity/trufflehog@d232362a64a09a9e7d58267b8f5acef00ae90e23 # v3.100.0
        with:
          extra_args: --results=verified,unknown --exclude-paths=.github/trufflehog-exclude-paths.txt
