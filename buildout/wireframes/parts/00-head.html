<style>

:root { color-scheme: dark; --bg:#050807; --surface:#0a0f0d; --surface-2:#101714; --line:#1a2621; --line-soft:#131c18; --control-line:#6b8478; --text:#eef3f1; --text-2:#93a39b; --accent:#3fd6b0; --accent-ink:#03130e; --warn:#e3b341; --bad:#ff7b72; --ok:#3fd6b0; --good:#4cc760; --pending:#8fa39a; --focus:#7ff0d0;
  --chart-empty:#0a0f0d; --series-1:#6ea8ff; --series-2:#c58bd6; --series-3:#e3a23c; --series-4:#f07a88;
  --suspect-red:#ff7b72; --suspect-orange:#f0a04b; --suspect-green:#3fb27f; --suspect-grey:#8fa39a;
  --suspect-red-soft:rgb(255 123 114 / 16%); --suspect-orange-soft:rgb(240 160 75 / 16%); --suspect-green-soft:rgb(63 178 127 / 16%); --suspect-grey-soft:rgb(143 163 154 / 16%);
  --hatch:repeating-linear-gradient(135deg, rgb(143 163 154 / 35%) 0 2px, transparent 2px 6px); }
:root[data-theme="light"] { color-scheme: light; --bg:#f5f5f3; --surface:#ffffff; --surface-2:#eeeeeb; --line:#d9d9d4; --line-soft:#e8e8e4; --control-line:#74808f; --text:#16191d; --text-2:#4a525c; --accent:#0b6b57; --accent-ink:#ffffff; --warn:#96600a; --bad:#b02a3d; --ok:#0b6b57; --good:#1e7a34; --pending:#5b6878; --focus:#0b6b57;
  --chart-empty:#efefec; --series-1:#2457c5; --series-2:#9956a1; --series-3:#ad6511; --series-4:#b02a3d;
  --suspect-red:#b02a3d; --suspect-orange:#9a5408; --suspect-green:#1f7a4f; --suspect-grey:#5b6878;
  --suspect-red-soft:rgb(176 42 61 / 12%); --suspect-orange-soft:rgb(154 84 8 / 12%); --suspect-green-soft:rgb(31 122 79 / 12%); --suspect-grey-soft:rgb(91 104 120 / 12%); }
:root { --font:"IBM Plex Sans","Segoe UI Variable Text",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace; --r:2px; --header-h:56px; }
* { box-sizing:border-box; }
html,body { height:100%; margin:0; }
body { background:var(--bg); color:var(--text); font:13px/1.45 var(--font); }
button { font:inherit; color:inherit; cursor:pointer; }
h1,h2,h3,h4,p { margin:0; } h1,h2,h3,h4 { font-weight:600; letter-spacing:-.01em; }
:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
.mono { font-family:var(--mono); }

/* ---- the app shell: the window never scrolls; one region does ---- */
.app { height:100dvh; display:flex; flex-direction:column; overflow:hidden; }
.hdr { flex:0 0 var(--header-h); display:flex; align-items:center; gap:16px; padding:0 24px; border-bottom:1px solid var(--line); background:var(--surface); }
.brand { font-weight:600; font-size:15px; letter-spacing:.02em; } .brand b { color:var(--accent); }
.hdr nav { display:flex; gap:4px; margin-left:12px; }
.hdr nav span { padding:6px 10px; color:var(--text-2); } .hdr nav span.on { color:var(--text); box-shadow:inset 0 -2px 0 var(--accent); }
.hdr .sp { flex:1; }
.btn { padding:6px 12px; background:transparent; border:1px solid var(--control-line); border-radius:var(--r); }
.btn:hover { border-color:var(--text-2); background:var(--surface-2); }
.btn.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; }
.btn.sm { padding:3px 8px; font-size:12px; }
.btn[disabled] { opacity:.5; cursor:default; }
.quiet { padding:3px 8px; background:none; border:0; color:var(--accent); text-align:left; }
.quiet:hover { text-decoration:underline; }
.work { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }

/* ---- the case bar: ONE back, the case, the mode switch ---- */
.bar { flex:0 0 auto; display:flex; align-items:center; gap:14px; padding:10px 24px; border-bottom:1px solid var(--line); background:var(--bg); }
.bar .crumb { display:grid; gap:1px; min-width:0; flex:1; }
.bar .crumb small { color:var(--text-2); font-size:12px; }
.bar h2 { font-size:18px; }
.runbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); }
.runbar .win { color:var(--text-2); } .runbar .win b { color:var(--text); font-weight:500; }
.runbar .stale { color:var(--warn); }

/* ---- stickers, cards, tables ---- */
.sticker { display:inline-block; padding:1px 8px; border-radius:var(--r); font-size:12px; font-weight:600; white-space:nowrap; background:var(--surface-2); }
.sticker.ready { background:var(--suspect-green-soft); } .sticker.partly { background:var(--suspect-orange-soft); }
.sticker.cannot { background:var(--suspect-grey-soft); } .sticker.failed { background:var(--suspect-red-soft); }
.sticker.waiting, .sticker.running { padding-left:18px; background-color:var(--surface-2); background-image:var(--hatch); background-size:10px 100%; background-repeat:no-repeat; }
.sticker.stale { white-space:normal; box-shadow:inset 0 0 0 1px var(--line); font-weight:500; color:var(--text-2); }
.card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; display:grid; gap:8px; align-content:start; }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; }
.fig { font-size:24px; font-weight:500; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
.note { color:var(--text-2); font-size:12px; } .lead { color:var(--text-2); max-width:75ch; }
.finding { padding:8px 12px; background:var(--surface-2); border-radius:var(--r); }
.err { border:1px solid var(--bad); background:color-mix(in srgb,var(--bad) 10%,var(--surface)); padding:10px 12px; border-radius:var(--r); display:grid; gap:4px; }
.warn { border:1px solid var(--warn); padding:8px 12px; border-radius:var(--r); display:grid; gap:4px; } .warn ul { margin:0; padding-left:18px; }
.notice { border:1px solid var(--line); background:var(--surface-2); padding:8px 12px; border-radius:var(--r); }
.stop { display:grid; gap:6px; padding:12px; border:1px solid var(--warn); border-radius:var(--r); } .stop ul { margin:0; padding-left:18px; color:var(--text-2); }
.missing { display:grid; gap:8px; padding:12px; border:1px solid var(--line); border-left:4px solid var(--suspect-grey); border-radius:var(--r); background:var(--surface); }
table { width:100%; border-collapse:collapse; font-size:13px; }
th,td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line-soft); font-variant-numeric:tabular-nums; vertical-align:top; }
th { color:var(--text-2); font-weight:500; font-size:12px; }
caption { padding:0 0 6px; text-align:left; font-size:13px; font-weight:600; }
tr.sel td { background:var(--surface-2); }
.tscroll { overflow:auto; }
.slow { color:var(--bad); }
.mark { font-weight:600; white-space:nowrap; } .mark.bad { color:var(--suspect-red); } .mark.ok { color:var(--suspect-green); } .mark.grey { color:var(--text-2); }
