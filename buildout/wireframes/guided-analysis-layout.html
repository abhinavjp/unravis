.A .grp { margin:12px 0 4px; font-size:11px; font-weight:600; color:var(--text-2); text-transform:uppercase; letter-spacing:.08em; }
.A .grp:first-child { margin-top:0; }
.A .rail .row { display:grid; grid-template-columns:22px 1fr auto; gap:8px; align-items:center; width:100%; text-align:left; padding:7px 8px; background:transparent; border:1px solid var(--line); border-radius:var(--r); }
.A .rail .row:hover { border-color:var(--text-2); background:var(--surface-2); }

.A .pane { overflow:auto; scrollbar-width:thin; padding:0 28px 48px; scroll-padding-top:64px; }
.A .pane .runbar { position:sticky; top:0; z-index:2; margin:0 -28px 16px; padding:10px 28px; border-radius:0; border-width:0 0 1px; }

/* ============ VARIANT B: top stepper in three phases ============ */
.B .stepper { flex:0 0 auto; display:flex; gap:18px; padding:8px 24px; border-bottom:1px solid var(--line); background:var(--surface); overflow-x:auto; scrollbar-width:thin; }
.B .ph { display:grid; gap:4px; } .B .ph > small { font-size:11px; font-weight:600; color:var(--text-2); text-transform:uppercase; letter-spacing:.08em; }
.B .chips { display:flex; gap:4px; }
.B .chip { display:flex; align-items:center; gap:6px; padding:5px 9px; background:transparent; border:1px solid var(--line); border-radius:var(--r); white-space:nowrap; }
.B .chip:hover { border-color:var(--text-2); } .B .chip.cur { border-color:var(--accent); box-shadow:inset 0 -2px 0 var(--accent); font-weight:600; }
.B .chip i { width:8px; height:8px; border-radius:50%; background:var(--pending); display:inline-block; }
.B .chip i.ready { background:var(--ok); } .B .chip i.partly { background:var(--warn); } .B .chip i.failed { background:var(--bad); }
.B .pane { flex:1 1 auto; min-height:0; overflow:auto; padding:18px 24px 40px; scrollbar-width:thin; }
.B .pane .runbar { margin-bottom:16px; }

/* ============ VARIANT C: one flow, steps fold open ============ */
.C .body { flex:1 1 auto; min-height:0; display:grid; grid-template-columns:170px minmax(0,1fr); }
.C .prog { padding:18px 8px 18px 24px; border-right:1px solid var(--line); display:grid; gap:10px; align-content:start; }
.C .prog .meter { height:6px; background:var(--surface-2); border-radius:3px; overflow:hidden; } .C .prog .meter div { height:100%; background:var(--accent); }

.C .fold { border:1px solid var(--line); border-radius:var(--r); margin-bottom:8px; background:var(--surface); max-width:1100px; }
.C .fold > button { display:flex; width:100%; align-items:center; gap:10px; padding:10px 14px; background:none; border:0; text-align:left; }
.C .fold.cur > button { font-weight:600; box-shadow:inset 3px 0 0 var(--accent); }
.C .fold .inner { padding:6px 16px 18px; border-top:1px solid var(--line-soft); }
.C .fold .n { color:var(--text-2); width:22px; }
.C .fold .sp { flex:1; }

.manual-body { flex:1 1 auto; min-height:0; overflow:auto; padding:18px 28px 60px; scrollbar-width:thin; }
.manual-body .mwrap { display:grid; gap:14px; max-width:1100px; }

/* floating prototype switcher */
.switcher { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:50; display:flex; align-items:center; gap:10px; padding:6px 10px; background:var(--text); color:var(--bg); border-radius:999px; box-shadow:0 6px 24px rgb(0 0 0 / 40%); font-weight:500; }

  .C .prog { display:none; } .demo-note { display:none; }

// ---------- formatting helpers (mirror stepModel.ts) ----------
function fmtCount(n){ return Math.round(n).toLocaleString('en-US'); }
function fmtMs(n){ return Math.round(n).toLocaleString('en-US') + ' ms'; }
function fmtPct(n){ var r = Math.round(n); return (r > 0 ? '+' : r < 0 ? '-' : '') + Math.abs(r).toLocaleString('en-US') + ' %'; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ---------- per-minute series for the charts (reference 08:00-08:59, incident 09:00-09:59) ----------
// One value per minute: p95 ms and average calls in flight. The long gap 09:31-09:44 breaks the incident line.
var SERIES = (function(){
  var out = [], inc = [];
  for (var m = 0; m < 60; m++) {
    var hm = function(h){ return '2026-10-26T' + (h < 10 ? '0'+h : h) + ':' + (m < 10 ? '0'+m : m) + ':00Z'; };
    var jitter = ((m * 37) % 23) - 11; // deterministic wobble, no randomness so the build is stable
    var refP = 420 + jitter * 4 + (m % 9 === 0 ? 30 : 0);
    out.push({ at:hm(8), win:'reference', p95:Math.round(refP), inFlight:4 + (m % 5 === 0 ? 1 : 0) + jitter / 22 });
    var incP, inf;
    if (m < 14) { incP = 430 + jitter; inf = 4 + jitter / 11; }
    else { var rise = Math.min(1, (m - 14) / 6); incP = 430 + rise * 1670 + jitter * 3; inf = 4 + rise * 17.5 + jitter / 11; }
    var gap = (m >= 31 && m <= 44) ? 'long' : '';
    inc.push({ at:hm(9), win:'incident', p95:Math.round(incP), inFlight:Math.round(inf * 10) / 10, gap:gap });
  }
  return out.concat(inc);
})();

// MinuteLine: the same SVG the app draws (runs of one window, a gap breaks the line), caption with range and peak, legend.
function minuteLine(field, label, unit) {
  var W = 640, H = 140, PAD = 4;
  var pts = SERIES.map(function(p){ return { at:p.at, win:p.win, v:p[field], gap:!!p.gap }; });
  var peak = 0; pts.forEach(function(p){ if (!p.gap && typeof p.v === 'number' && p.v > peak) peak = p.v; });
  var top = Math.max(1, peak);
  var x = function(i){ return PAD + (i / (pts.length - 1)) * (W - 2 * PAD); };
  var y = function(v){ return H - PAD - (v / top) * (H - 2 * PAD); };
  var runs = [], cur = null;
  pts.forEach(function(p, i){
    if (typeof p.v !== 'number' || p.gap) { if (cur) runs.push(cur); cur = null; return; }
    if (!cur || cur.win !== p.win) { if (cur) runs.push(cur); cur = { win:p.win, d:[] }; }
    cur.d.push((cur.d.length ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1));
  });
  if (cur) runs.push(cur);
  var cap = field === 'p95' ? 'Highest ' + Math.round(peak).toLocaleString('en-US') + ' ' + unit + '.'
    : 'Highest minute average: ' + (Math.round(peak * 10) / 10) + ' ' + (Math.round(peak) === 1 ? unit.replace(/s$/,'') : unit) + '.';
  var paths = runs.map(function(r){ return '<path d="' + r.d.join(' ') + '" class="line ' + (r.win === 'incident' ? 'incident' : 'normal') + '"/>'; }).join('');
  return '<figure class="ml"><figcaption>' + label + ' <span class="range">26 Oct 08:00 to 26 Oct 09:59 UTC. ' + cap + '</span></figcaption>'
    + '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + label + '" preserveAspectRatio="none">'
    + '<line x1="' + PAD + '" y1="' + (H - PAD) + '" x2="' + (W - PAD) + '" y2="' + (H - PAD) + '" class="axis"/>' + paths + '</svg>'
    + '<p class="legend"><span class="key normal"></span> Normal <span class="key incident"></span> Incident. A break in a line is a minute with no data.</p></figure>';
}

</script>

<script>
// ---------- tools-A extras: gap shading, why-it-moved links, slow-call duration bars, time-split per-API rows ----------
// Loads after parts/10-data.js (ROUTES) and before parts/41-tools-a.js; nothing here reads W at load time.
// New globals: TA_SPLIT, TA_MOVED, TA_gapShade, TA_whyMoved, TA_callBars, TA_splitByApi.

// Per-API A/C/P/O rows for the time-split picker. The pooled normal shape (A 18, C 240,
// P 12, O 150; total 420 ms) is scaled to each API's reference P95. APIs marked bad get
// the pooled incident shape (A 22, C 480, P 14, O 1584; total 2100 ms) scaled to their
// incident P95; the rest keep the normal shape scaled to their incident P95.
var TA_SPLIT = (function(){
  var SHAPE = [ ['A', 18, 22], ['C', 240, 480], ['P', 12, 14], ['O', 150, 1584] ];
  var out = [];
  for (var r = 0; r < ROUTES.length; r++) {
    var row = ROUTES[r], parts = {};
    for (var i = 0; i < SHAPE.length; i++) {
      var k = SHAPE[i][0], n = SHAPE[i][1], inc = SHAPE[i][2];
      var normal = Math.round(n * row[3] / 420);
      var incident = Math.round((row[6] === 'bad' ? inc : n) * row[2] / (row[6] === 'bad' ? 2100 : 420));
      parts[k] = [normal, incident];
    }
    out.push({ api: row[0], parts: parts });
  }
  return out;
})();

// One plain-English line per API that moved, with the tool that holds the evidence.
var TA_MOVED = [
  { api: 'Orders.Create', tool: 'sql-waits', why: 'Outside time (O) grew from 150 ms to 1,584 ms behind it, and lock waits on the Orders tables rose in the same minute, 09:14 UTC.' },
  { api: 'Orders.List', tool: 'sql-waits', why: 'It reads the same Orders tables, so it queued behind the lock waits that Orders.Create triggered at 09:14 UTC.' },
  { api: 'Payments.Authorize', tool: 'sql-waits', why: 'It waits on the same write batch that the log flush held back, so it slowed in the same minute as the other two.' }

// minutes 31 to 44, points 91 to 104 of the 120-point x axis, positioned with the same
// formula minuteLine uses. The band goes right after the opening svg tag, so the lines
// draw over it.
function TA_gapShade(html){
  var MARK = 'preserveAspectRatio="none">';
  var at = html.indexOf(MARK);
  if (at < 0) return html;
  var CW = 640, PAD = 4, N = 120;
  var x = function(i){ return PAD + (i / (N - 1)) * (CW - 2 * PAD); };
  var band = '<rect class="ta-gap" x="' + x(91).toFixed(1) + '" y="' + PAD + '" width="' + (x(104) - x(91)).toFixed(1) + '" height="' + (140 - 2 * PAD) + '" rx="2"/>';
  return html.slice(0, at + MARK.length) + band + html.slice(at + MARK.length);
}

// The "Why each API moved" fold for the response-time tool.
function TA_whyMoved(){
  if (typeof TA_MOVED === 'undefined' || !TA_MOVED.length) return '';
  var out = '<details class="ev-fold"><summary>Why each API moved</summary>';
  for (var i = 0; i < TA_MOVED.length; i++) {

// Duration bars for the slowest-calls tool: one bar per listed call, height = duration
// in ms, drawn with the shared evidence bar chart. The time axis is the shared minute

// The API picker and per-API rows for the time-split tool. W.taSplitApi is 'all' or one
// API name; W.taSplitMatch is a case-insensitive substring. An API pick wins over the
// match. The pooled table and bars above are untouched.
function TA_splitByApi(){
  if (typeof TA_SPLIT === 'undefined' || !TA_SPLIT.length) return '';
  var WORD = { A: 'Audit set-up (A)', C: 'Action time (C)', P: 'Payload record (P)', O: 'Outside time (O)' };

    return '<tr><td>' + r.api + '</td>' + cells + '<td>' + best + '</td></tr>';
  }).join('');
  return picker
    + '<div class="tscroll"><table><thead><tr><th>API</th><th>Audit set-up (A)</th><th>Action time (C)</th><th>Payload record (P)</th><th>Outside time (O)</th><th>Grew most</th></tr></thead><tbody>'
    + body + '</tbody></table></div>'
    + '<p class="note">Per-API rows: each part of the call, normal against incident. Pick one API, or type to match several; the pooled chart above stays as it is.</p>';
}

<script>
// Chart helpers A: pure SVG string builders (no DOM access, ES5 only). tlChart draws the shared 120-minute
// timeline with per-window runs and optional event markers; stackedArea draws a stacked (optionally 100%) area chart.

function tlChart(series, markers, unit) {
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  var W = 640, H = 140, PAD = 4, TMAX = 119;
  if (!series || !series.length) return '<p class="note">Not enough data to draw this chart.</p>';
  var i, j, pts, cls, run;
  var top = 1;
  for (i = 0; i < series.length; i++) {
    pts = series[i].pts || [];
    for (j = 0; j < pts.length; j++) if (typeof pts[j].v === 'number' && pts[j].v > top) top = pts[j].v;
  }
  var x = function(t){ return PAD + (t / TMAX) * (W - 2 * PAD); };
  var y = function(v){ return H - PAD - (v / top) * (H - 2 * PAD); };
  var paths = [];
  var winSeen = { normal: 0, incident: 0 };
  for (i = 0; i < series.length; i++) {
    pts = series[i].pts || [];
    cls = series[i].win === 'incident' ? 'incident' : 'normal';
    var dashed = winSeen[cls] > 0;
    winSeen[cls]++;
    run = [];
    for (j = 0; j <= pts.length; j++) {
      if (j < pts.length && typeof pts[j].t === 'number' && typeof pts[j].v === 'number') {
        run.push((run.length ? 'L' : 'M') + x(pts[j].t).toFixed(1) + ' ' + y(pts[j].v).toFixed(1));
        continue;
      }
      if (run.length >= 2) paths.push('<path d="' + run.join(' ') + '" class="line ' + cls + '"' + (dashed ? ' style="stroke-dasharray:6 4"' : '') + '/>');
      run = [];
    }
  }
  var mkLines = [], mkTexts = [], ms = markers || [];
  for (i = 0; i < ms.length; i++) {
    if (typeof ms[i].t !== 'number') continue;
    var mx = x(ms[i].t).toFixed(1);
    mkLines.push('<line x1="' + mx + '" y1="' + PAD + '" x2="' + mx + '" y2="' + (H - PAD) + '" class="marker"/>');
    mkTexts.push('<text x="' + mx + '" y="' + (PAD + 10) + '" class="mk-label">' + esc(ms[i].label == null ? '' : ms[i].label) + '</text>');
  }
  var names = [];
  for (i = 0; i < series.length; i++) if (names.indexOf(series[i].name) < 0) names.push(series[i].name);
  var cap = series.length === 1 ? series[0].name : names.join(' and ');
  var winNames = { normal: [], incident: [] };
  for (i = 0; i < series.length; i++) {
    var wn = series[i].win === 'incident' ? 'incident' : 'normal';
    winNames[wn].push(series[i].name);
  }
  var winOrder = ['normal', 'incident'];
  var keys = [];
  for (var wo = 0; wo < winOrder.length; wo++) {
    var wkey = winOrder[wo], warr = winNames[wkey];
    if (!warr.length) continue;
    if (warr.length === 1) {
      keys.push('<span class="key ' + wkey + '"></span> ' + (wkey === 'normal' ? 'Normal' : 'Incident'));
    } else {
      for (var wk = 0; wk < warr.length; wk++) {
        keys.push('<span class="key ' + wkey + '"></span> ' + esc(warr[wk]) + ' (' + (wk === 0 ? 'solid' : 'dashed') + ')');
      }
    }
  }
  var legend = keys.length ? '<p class="legend">' + keys.join(' ') + '. A break in a line is a minute with no data.</p>' : '<p class="legend"></p>';
  return '<figure class="ml"><figcaption>' + esc(cap) + '</figcaption>'
    + '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(cap) + '" preserveAspectRatio="none">'
    + '<line x1="' + PAD + '" y1="' + (H - PAD) + '" x2="' + (W - PAD) + '" y2="' + (H - PAD) + '" class="axis"/>'
    + axYLabels(top, unit || '', W, H, PAD)
    + axXLabels([{ t: 0, x: x(0) }, { t: 60, x: x(60) }, { t: TMAX, x: x(TMAX) }], H, PAD)
    + mkLines.join('') + paths.join('') + mkTexts.join('') + '</svg>' + legend + '</figure>';
}

function stackedArea(series, pct, unit, colsT, incT) {
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  var W = 640, H = 140, PAD = 4;
  var cols = (series && series[0] && series[0].vals) ? series[0].vals.length : 0;
  if (!series || !series.length || cols < 2) return '<p class="note">Not enough data to draw this chart.</p>';
  var i, j, c;
  var cell = function(j, c) {
    var v = (series[j].vals || [])[c];
    return typeof v === 'number' ? v : 0;
  };
  var totals = [];
  for (c = 0; c < cols; c++) { totals.push(0); for (j = 0; j < series.length; j++) totals[c] += cell(j, c); }
  var top = pct ? 100 : 1;
  if (!pct) for (c = 0; c < cols; c++) if (totals[c] > top) top = totals[c];
  var val = function(j, c) {
    if (pct) return totals[c] > 0 ? (cell(j, c) / totals[c]) * 100 : 0;
    return cell(j, c);
  };
  var x = function(c){ return PAD + (c / (cols - 1)) * (W - 2 * PAD); };
  var y = function(v){ return H - PAD - (v / top) * (H - 2 * PAD); };
  var lo = [], hi = [];
  for (j = 0; j < series.length; j++) { lo.push([]); hi.push([]); }
  for (c = 0; c < cols; c++) {
    var cum = 0;
    for (j = 0; j < series.length; j++) { lo[j].push(cum); cum += val(j, c); hi[j].push(cum); }
  }
  var paths = [], names = [], items = [];
  for (j = 0; j < series.length; j++) {
    var d = [], k;
    for (c = 0; c < cols; c++) d.push((c ? 'L' : 'M') + x(c).toFixed(1) + ' ' + y(lo[j][c]).toFixed(1));
    for (k = cols - 1; k >= 0; k--) d.push('L' + x(k).toFixed(1) + ' ' + y(hi[j][k]).toFixed(1));
    paths.push('<path d="' + d.join(' ') + ' Z" class="area s-' + esc(series[j].cls) + '"/>');
    names.push(esc(series[j].name));
    items.push('<span class="key s-' + esc(series[j].cls) + '"></span> ' + esc(series[j].name));
  }
  var cap = 'Stacked ' + names.join(', ');
  var ax = axYLabels(top, unit || '', W, H, PAD);
  if (Object.prototype.toString.call(colsT) === '[object Array]' && colsT.length === cols) {
    var midC = Math.floor((cols - 1) / 2);
    ax += axXLabels([
      { t: colsT[0], x: x(0) },
      { t: colsT[midC], x: x(midC) },
      { t: colsT[cols - 1], x: x(cols - 1) }
    ], H, PAD);
    if (typeof incT === 'number') {
      for (var mi = 0; mi < cols; mi++) {
        if (colsT[mi] >= incT) {
          ax += axIncidentLine(x(mi), PAD, H - PAD);
          break;
        }
      }
    }
  }
  return '<figure class="ml"><figcaption>' + cap + '</figcaption>'
    + '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + cap + '" preserveAspectRatio="none">'
    + '<line x1="' + PAD + '" y1="' + (H - PAD) + '" x2="' + (W - PAD) + '" y2="' + (H - PAD) + '" class="axis"/>'
    + ax + paths.join('') + '</svg><p class="legend">' + items.join(' ') + '</p></figure>';
}

<script>
// Axis helpers for the evidence charts: shared unit detection, compact tick formatting,
// y tick labels (0, half, max), x time labels (first, middle, last) and the dashed
// incident-window marker. Pure string builders: no DOM access, no W, ES5 only.

function axUnit(series) {
  if (Object.prototype.toString.call(series) !== '[object Array]') return '';
  var unit = '';
  var same = true;
  var seen = false;
  for (var i = 0; i < series.length; i++) {
    var s = series[i];
    if (!s) continue;
    var name = String(s.name == null ? '' : s.name);
    var u = '';
    var m = name.match(/\(([^()]*)\)\s*$/);
    if (m && /^[A-Za-z%\/ ]{1,10}$/.test(m[1])) {
      u = m[1].replace(/^\s+|\s+$/g, '');
    } else if (/\s%$/.test(name)) {
      u = '%';
    }
    if (!seen) {
      seen = true;
      unit = u;
    } else if (u !== unit) {
      same = false;
    }
  }
  if (!seen || !same) return '';
  return unit;
}

function axFmt(v, unit) {
  var s;
  if (Math.abs(v) >= 1000) {
    s = String(Math.round(v / 100) / 10).replace(/\.0$/, '') + 'k';
  } else {
    s = String(Math.round(v * 10) / 10).replace(/\.0$/, '');
  }
  return unit ? s + ' ' + unit : s;
}

function axIncidentT(series) {
  if (Object.prototype.toString.call(series) !== '[object Array]') return null;
  var best = null;
  for (var i = 0; i < series.length; i++) {
    var s = series[i];
    if (!s || s.win !== 'incident') continue;
    var pts = s.pts;
    if (Object.prototype.toString.call(pts) !== '[object Array]') continue;
    for (var j = 0; j < pts.length; j++) {
      var p = pts[j];
      if (p && typeof p.t === 'number' && (best === null || p.t < best)) best = p.t;
    }
  }
  return best;
}

function axYLabels(top, unit, W, H, PAD) {
  function y(v) { return H - PAD - (v / top) * (H - 2 * PAD); }
  return '<text class="axis-label" x="' + (PAD + 2) + '" y="' + (y(top) + 9).toFixed(1) + '">' + axFmt(top, unit) + '</text>'
    + '<text class="axis-label" x="' + (PAD + 2) + '" y="' + (y(top / 2) - 3).toFixed(1) + '">' + axFmt(top / 2, unit) + '</text>'
    + '<text class="axis-label" x="' + (PAD + 2) + '" y="' + (y(0) - 2).toFixed(1) + '">' + axFmt(0, unit) + '</text>';
}

function axXLabels(items, H, PAD) {
  var out = [];
  for (var i = 0; i < items.length; i++) {
    var anchor = i === 0 ? 'start' : (i === items.length - 1 ? 'end' : 'middle');
    out.push('<text class="axis-label" x="' + items[i].x.toFixed(1) + '" y="' + (H - PAD - 14).toFixed(1) + '" text-anchor="' + anchor + '">+' + items[i].t + ' min</text>');
  }
  return out.join('');
}

function axIncidentLine(x, yTop, yBot) {
  return '<line x1="' + x.toFixed(1) + '" y1="' + yTop + '" x2="' + x.toFixed(1) + '" y2="' + yBot + '" class="marker"/>';
}

</script>

<script>
// Heatmap: a rows x cols grid of value cells, used by the host-resource heatmap and the
// recurrence day-by-hour calendar. Pure function, returns an SVG string, no DOM access.
function heatmap(cells, cols, rows) {
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  if (!cols || !rows || !cols.length || !rows.length) {
    return '<p class="note">Not enough data to draw this chart.</p>';
  }
  var GUT = 56, TOP = 18, CH = 16, W = 640;
  var H = Math.max(80, TOP + rows.length * CH);
  var cw = (W - GUT) / cols.length;
  cells = cells || [];
  var i, max = 0;
  for (i = 0; i < cells.length; i++) {
    var cv = cells[i] ? cells[i].v : null;
    if (typeof cv === 'number' && cv > max) max = cv;
  }
  function level(v) {
    if (typeof v !== 'number') return 0;
    if (max <= 0 || v <= 0) return 1;
    var l = Math.ceil((v / max) * 4);
    return l < 1 ? 1 : (l > 4 ? 4 : l);
  }
  var fills = {
    0: 'var(--surface-2)',
    1: 'color-mix(in srgb, var(--bad) 20%, var(--surface))',
    2: 'color-mix(in srgb, var(--bad) 40%, var(--surface))',
    3: 'color-mix(in srgb, var(--bad) 65%, var(--surface))',
    4: 'color-mix(in srgb, var(--bad) 90%, var(--surface))'
  };
  var nth = Math.max(1, Math.ceil(cols.length / 12));
  var labels = [];
  for (i = 0; i < cols.length; i += nth) {
    labels.push('<text class="axis-label" x="' + (GUT + i * cw + cw / 2).toFixed(1) + '" y="12" text-anchor="middle">' + esc(cols[i]) + '</text>');
  }
  for (i = 0; i < rows.length; i++) {
    labels.push('<text class="axis-label" x="' + (GUT - 4) + '" y="' + (TOP + i * CH + 12) + '" text-anchor="end">' + esc(rows[i]) + '</text>');
  }
  var map = {};
  for (i = 0; i < cells.length; i++) {
    var cc = cells[i];
    if (cc && typeof cc.r === 'number' && typeof cc.c === 'number') map[cc.r + ':' + cc.c] = cc;
  }
  var rects = [];
  for (var r = 0; r < rows.length; r++) {
    for (var c = 0; c < cols.length; c++) {
      var cell = map[r + ':' + c];
      var v = cell ? cell.v : null;
      var tip = cell && cell.tip ? cell.tip : '';
      var lv = level(v);
      var t = rows[r] + ', ' + cols[c] + ': ' + (v == null ? 'no data' : v) + (tip ? ' (' + tip + ')' : '');
      rects.push('<rect class="cell l' + lv + '" x="' + (GUT + c * cw).toFixed(1) + '" y="' + (TOP + r * CH)
        + '" width="' + cw.toFixed(1) + '" height="' + CH + '" rx="2" style="fill:' + fills[lv] + '">'
        + '<title>' + esc(t) + '</title></rect>');
    }
  }
  var svg = '<svg role="img" aria-label="Heatmap" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">'
    + labels.join('') + rects.join('') + '</svg>';
  var legend = '<p class="legend"><span class="key hm0"></span> No data <span class="key hm1"></span> Low <span class="key hm2"></span> Medium <span class="key hm3"></span> High <span class="key hm4"></span> Very high</p>';
  return '<figure class="ml"><figcaption>Heatmap</figcaption>' + svg + legend + '</figure>';
}

</script>

<script>
// Swimlane: one horizontal lane per series (API, SQL, Mongo, Host...), events as bars or dots on a shared minute axis, an optional time brush.
function swimlane(lanes, window, brush) {
  var W = 640, GUT = 80, LANE_H = 28, AXIS_H = 24, PAD = 4;

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  var win = window || {};
  var from = typeof win.from === 'number' ? win.from : 0;
  var to = typeof win.to === 'number' ? win.to : 119;
  if (!(to > from)) { from = 0; to = 119; }

  var hasBrush = !!(brush && typeof brush.from === 'number' && typeof brush.to === 'number' && brush.to >= brush.from);
  var bFrom = hasBrush ? brush.from : 0;
  var bTo = hasBrush ? brush.to : 0;

  var list = lanes || [];
  var span = to - from;

  function x(m) { return GUT + ((m - from) / span) * (W - GUT); }
  function sevStyle(sev) {
    if (sev === 'ok') return 'fill:var(--good)';
    if (sev === 'warn') return 'fill:var(--warn)';
    if (sev === 'bad') return 'fill:var(--bad)';
    return 'fill:var(--text-2)';
  }

  var H = AXIS_H + list.length * LANE_H + PAD;
  var body = '';
  var any = false;
  for (var i = 0; i < list.length; i++) {
    var lane = list[i] || {};
    var evs = lane.events || [];
    var yTop = AXIS_H + i * LANE_H;
    body += '<text x="' + PAD + '" y="' + (yTop + LANE_H / 2) + '" class="axis-label">' + esc(lane.name) + '</text>';
    body += '<line x1="' + GUT + '" y1="' + (yTop + LANE_H) + '" x2="' + W + '" y2="' + (yTop + LANE_H) + '" class="axis"/>';
    for (var j = 0; j < evs.length; j++) {
      var e = evs[j];
      if (!e || typeof e.t !== 'number') continue;
      var t = e.t, dur = e.dur || 0, end = t + dur;
      if (t > to || end < from) continue;
      any = true;
      var cls = (hasBrush && t <= bTo && end >= bFrom) ? 'ev in-brush' : 'ev';
      var title = esc(lane.name) + ': ' + esc(e.label) + ' (minute ' + t + (dur ? ' for ' + dur + ' min' : '') + ')';
      if (dur > 0) {
        var w = x(end) - x(t);
        if (!(w >= 3)) w = 3;
        body += '<rect class="' + cls + '" x="' + x(t).toFixed(1) + '" y="' + (yTop + 5) + '" width="' + w.toFixed(1)
          + '" height="' + (LANE_H - 10) + '" rx="2" style="' + sevStyle(e.sev) + '"><title>' + title + '</title></rect>';
      } else {
        body += '<circle class="' + cls + '" cx="' + x(t).toFixed(1) + '" cy="' + (yTop + LANE_H / 2)
          + '" r="4" style="' + sevStyle(e.sev) + '"><title>' + title + '</title></circle>';
      }
    }
  }

  if (!any) return '<p class="note">No activity to show.</p>';

  var axis = '<line x1="' + GUT + '" y1="' + AXIS_H + '" x2="' + W + '" y2="' + AXIS_H + '" class="axis"/>';
  for (var m = from; m <= to; m += 15) {
    var tx = x(m).toFixed(1);
    axis += '<line x1="' + tx + '" y1="' + (AXIS_H - 5) + '" x2="' + tx + '" y2="' + AXIS_H + '" class="axis"/>'
      + '<text x="' + tx + '" y="' + (AXIS_H - 8) + '" class="axis-label" text-anchor="middle">+' + (m - from) + '</text>';
  }

  var band = '';
  if (hasBrush) {
    var bx1 = x(Math.max(bFrom, from)), bx2 = x(Math.min(bTo, to));
    var bw = bx2 - bx1;
    if (!(bw > 0)) bw = 1;
    band = '<rect class="brush" x="' + bx1.toFixed(1) + '" y="' + AXIS_H + '" width="' + bw.toFixed(1)
      + '" height="' + (list.length * LANE_H) + '" style="fill:var(--accent);fill-opacity:.15"/>';
  }

  var legend = '<p class="legend"><span class="key" style="background:var(--good)"></span> ok '
    + '<span class="key" style="background:var(--warn)"></span> warn '
    + '<span class="key" style="background:var(--bad)"></span> bad'
    + (hasBrush ? ' Shaded band is the selected time slice' : '') + '</p>';

  return '<figure class="ml"><figcaption>Nearby activity <span class="range">minute +' + from + ' to +' + to + '</span></figcaption>'
    + '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Nearby activity" preserveAspectRatio="none">'
    + axis + band + body + '</svg>' + legend + '</figure>';
}

</script>

<script>
function evAreaSeries(series) {
  if (Object.prototype.toString.call(series) !== '[object Array]') {
    return [];
  }

  var names = [];
  var i, j, k;
  var name, seen;

  for (i = 0; i < series.length; i++) {
    if (!series[i] || typeof series[i].name === 'undefined') {
      continue;
    }
    name = series[i].name;
    seen = false;
    for (j = 0; j < names.length; j++) {
      if (names[j] === name) {
        seen = true;
        break;
      }
    }
    if (!seen) {
      names.push(name);
    }
  }

  var byName = [];
  for (i = 0; i < names.length; i++) {
    var pts = [];
    var pass, idx, s, p;
    for (pass = 0; pass < 2; pass++) {
      var window = (pass === 0) ? 'normal' : 'incident';
      for (idx = 0; idx < series.length; idx++) {
        s = series[idx];
        if (!s || s.name !== names[i] || s.win !== window) {
          continue;
        }
        if (!s.pts) {
          continue;
        }
        for (k = 0; k < s.pts.length; k++) {
          p = s.pts[k];
          if (!p) {
            continue;
          }
          if (typeof p.t !== 'number' || typeof p.v !== 'number') {
            continue;
          }
          pts.push({ t: p.t, v: p.v });
        }
      }
    }
    byName.push(pts);
  }

  var cols = [];
  for (i = 0; i < byName.length; i++) {
    for (k = 0; k < byName[i].length; k++) {
      var col = byName[i][k].t;
      seen = false;
      for (j = 0; j < cols.length; j++) {
        if (cols[j] === col) {
          seen = true;
          break;
        }
      }
      if (!seen) {
        cols.push(col);
      }
    }
  }

  cols.sort(function (x, y) { return x - y; });

  if (cols.length === 0) {
    return [];
  }

  var result = [];
  for (i = 0; i < names.length; i++) {
    var pts2 = byName[i];
    var vals = [];
    for (k = 0; k < cols.length; k++) {
      var target = cols[k];
      var value;
      var exact = false;
      for (j = 0; j < pts2.length; j++) {
        if (pts2[j].t === target) {
          value = pts2[j].v;
          exact = true;
          break;
        }
      }
      if (!exact) {
        var bestT = -Infinity;
        var bestV = 0;
        var hasEarlier = false;
        for (j = 0; j < pts2.length; j++) {
          if (pts2[j].t < target && pts2[j].t > bestT) {
            bestT = pts2[j].t;
            bestV = pts2[j].v;
            hasEarlier = true;
          }
        }
        value = hasEarlier ? bestV : 0;
      }
      vals.push(value);
    }

    var cls;
    if (i === 0) {
      cls = 'a';
    } else if (i === 1) {
      cls = 'c';
    } else if (i === 2) {
      cls = 'p';
    } else {
      cls = 'o';
    }

    result.push({ name: names[i], cls: cls, vals: vals });
  }

  return result;
}

function evAreaCols(series) {
  var cols = [];
  if (Object.prototype.toString.call(series) !== '[object Array]') {
    return cols;
  }
  for (var i = 0; i < series.length; i++) {
    var s = series[i];
    if (!s || Object.prototype.toString.call(s.pts) !== '[object Array]') {
      continue;
    }
    for (var k = 0; k < s.pts.length; k++) {
      var p = s.pts[k];
      if (!p) {
        continue;
      }
      if (typeof p.t !== 'number' || typeof p.v !== 'number') {
        continue;
      }
      var seen = false;
      for (var j = 0; j < cols.length; j++) {
        if (cols[j] === p.t) {
          seen = true;
          break;
        }
      }
      if (!seen) {
        cols.push(p.t);
      }
    }
  }
  cols.sort(function (a, b) { return a - b; });
  return cols;
}

</script>

<script>
function evBars(series, unit, incT) {
  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  var EMPTY = '<p class="note">Not enough data to draw this chart.</p>';

  if (Object.prototype.toString.call(series) !== '[object Array]') {
    return EMPTY;
  }

  var bars = [];
  var i, j, s, p;
  for (i = 0; i < series.length; i++) {
    s = series[i];
    if (!s || !s.pts) continue;
    for (j = 0; j < s.pts.length; j++) {
      p = s.pts[j];
      if (!p) continue;
      if (typeof p.t !== 'number' || typeof p.v !== 'number') continue;
      if (isNaN(p.t) || isNaN(p.v)) continue;
      bars.push({ name: s.name, win: s.win, t: p.t, v: p.v });
    }
  }

  if (bars.length === 0) {
    return EMPTY;
  }

  var W = 640, H = 140, PAD = 4;
  var top = 1;
  for (i = 0; i < bars.length; i++) {
    if (bars[i].v > top) top = bars[i].v;
  }

  var sw = (W - 2 * PAD) / bars.length;
  var bw = sw * 0.7;
  if (bw < 3) bw = 3;

  var rects = '';
  var bar, x, h, y, fill, name, capNames, seen, key, cap;

  for (i = 0; i < bars.length; i++) {
    bar = bars[i];
    x = PAD + i * sw + (sw - bw) / 2;
    h = (bar.v > 0 ? bar.v : 0) / top * (H - 2 * PAD);
    y = H - PAD - h;
    fill = bar.win === 'incident' ? 'var(--series-4)' : 'var(--series-1)';
    name = esc(bar.name);
    rects += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) +
      '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) +
      '" rx="2" style="fill:' + fill + '"><title>' + name +
      ', minute ' + bar.t.toFixed(1) + ': ' + bar.v.toFixed(1) +
      '</title></rect>';
  }

  capNames = [];
  seen = {};
  for (i = 0; i < bars.length; i++) {
    key = String(bars[i].name);
    if (!seen[key]) {
      seen[key] = true;
      capNames.push(esc(bars[i].name));
    }
  }
  cap = capNames.join(' and ');

  var hasN = false, hasI = false;
  for (i = 0; i < bars.length; i++) { if (bars[i].win === 'incident') hasI = true; else hasN = true; }

  var ax = axYLabels(top, unit || '', W, H, PAD);
  var midB = Math.floor((bars.length - 1) / 2);
  ax += axXLabels([
    { t: bars[0].t, x: PAD + sw / 2 },
    { t: bars[midB].t, x: PAD + midB * sw + sw / 2 },
    { t: bars[bars.length - 1].t, x: PAD + (bars.length - 1) * sw + sw / 2 }
  ], H, PAD);
  if (typeof incT === 'number' && hasN && hasI) {
    for (var bi = 0; bi < bars.length; bi++) {
      if (bars[bi].win === 'incident') {
        ax += axIncidentLine(PAD + bi * sw, PAD, H - PAD);
        break;
      }
    }
  }

  var legend;
  if (capNames.length === 1 && series.length === 1 && String(capNames[0]).replace(/\s*\([^()]*\)\s*$/, '') === 'Call duration') {
    legend = '<span class="key incident"></span> Call duration';
  } else {
    var lkeys = [];
    if (hasN) lkeys.push('<span class="key normal"></span> Normal');
    if (hasI) lkeys.push('<span class="key incident"></span> Incident');
    legend = lkeys.join(' ');
  }

  return '<figure class="ml"><figcaption>' + cap +
    '</figcaption><svg viewBox="0 0 640 140" role="img" aria-label="' + cap +
    '" preserveAspectRatio="none"><line x1="4" y1="136" x2="636" y2="136" class="axis"/>' +
    ax +
    rects +
    '</svg><p class="legend">' + legend + '</p></figure>';
}

</script>

<script>

}

function evChart(c) {

  }

  if (c.chart === 'bars') return evBars(c.series, axUnit(c.series), axIncidentT(c.series)) + evChartCaption(c);
  return '<p class="note">This was not collected for this case, so there is no chart.</p>';
}

function evTable(c) {

      .split('&').join('&amp;')
      .split('<').join('&lt;')
      .split('>').join('&gt;')

  }
  if (!c) return '';

  if (!c.table || !c.table.cols || !c.table.cols.length || !c.table.rows || !c.table.rows.length) return '';
  var cols = c.table.cols;

  var html = '<table class="wf"><thead><tr>';

<script>

function evHelpMore(c, open) {

<script>
function evChartCaption(c) {
  function x(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  if (!c || (c.chart !== 'line' && c.chart !== 'stackedArea' && c.chart !== 'bars')) {
    return '';
  }
  var series = Object.prototype.toString.call(c.series) === '[object Array]' ? c.series : [];
  var hasNormal = false, hasIncident = false;
  for (var hci = 0; hci < series.length; hci++) {
    if (!series[hci]) { continue; }
    if (series[hci].win === 'incident') { hasIncident = true; } else { hasNormal = true; }
  }
  var oneCallDur = series.length === 1 && series[0] && String(series[0].name).replace(/\s*\([^()]*\)\s*$/, '') === 'Call duration';
  if (c.chart === 'bars' && oneCallDur) {
    return '<p class="ev-cap">Each bar is one call. A taller bar is a slower call.</p>';
  }
  if (c.chart === 'bars' && hasIncident && !hasNormal && !oneCallDur) {
    return '<p class="ev-cap">These bars are the incident hour.</p>';
  }
  function unitOf(name) {
    var s = String(name == null ? '' : name);
    var m = s.match(/\(([^()]*)\)\s*$/);
    if (m && /^[A-Za-z%\/ ]{1,10}$/.test(m[1])) {
      return String(m[1]).replace(/^\s+|\s+$/g, '');
    }
    if (/\s%$/.test(s)) {
      return '%';
    }
    return '';
  }
  var unit = '';
  var same = true;
  var seen = false;
  for (var i = 0; i < series.length; i++) {
    if (!series[i]) { continue; }
    var u = unitOf(series[i].name);
    if (!seen) {
      seen = true;
      unit = u;
    } else if (u !== unit) {
      same = false;
    }
  }
  if (!seen) { same = false; }
  var max = 0;
  if (c.chart === 'stackedArea') {
    var cols = evAreaSeries(series);
    var n = 0;
    if (Object.prototype.toString.call(cols) === '[object Array]' && cols.length &&
        Object.prototype.toString.call(cols[0].vals) === '[object Array]') {
      n = cols[0].vals.length;
    }
    for (var k = 0; k < n; k++) {
      var total = 0;
      for (var j = 0; j < cols.length; j++) {
        var vj = cols[j].vals[k];
        if (typeof vj === 'number' && !isNaN(vj)) {
          total += vj;
        }
      }
      if (total > max) { max = total; }
    }
  } else {
    for (var a = 0; a < series.length; a++) {
      var s = series[a];
      if (!s || Object.prototype.toString.call(s.pts) !== '[object Array]') { continue; }
      for (var b = 0; b < s.pts.length; b++) {
        var p = s.pts[b];
        if (typeof p === 'object' && p !== null && typeof p.v === 'number' && !isNaN(p.v)) {
          if (p.v > max) { max = p.v; }
        }
      }
    }
  }
  var t = 'Left part: the reference hour (a normal period). Right part: the incident hour. ';
  if (c.chart === 'line') {
    t += 'The dashed line marks when the incident starts. ';
  } else if (c.chart === 'stackedArea') {
    t += 'The bands are stacked, so the top edge is the total. ';
  } else {
    t += 'Each bar is one reading; the highlighted bars are from the incident hour. ';
  }
  if (max > 0) {
    if (same && unit !== '') {
      t += 'The bottom is 0 and the top is about ' + (Math.round(max * 10) / 10) + ' ' + unit + '.';
    } else {
      t += 'The bottom is 0 and the heights are relative; read the exact numbers in the table.';
    }
  }
  return '<p class="ev-cap">' + x(t.replace(/\s+$/, '')) + '</p>';
}

</script>

<script>
// Evidence banners: pretend a dependency source is missing (packet B2).
// Globals used from elsewhere: W (state), render(), EVDEP_DEFS, EVDEP_MAP.

var EVDEP_NAMES = {
  querystore: 'Query Store',
  qswaits: 'Query Store wait stats',
  systemhealth: 'system_health capture',
  viewstate: 'VIEW SERVER STATE',
  profiler: 'Profiler trace',
  monitorrole: 'Monitor role',
  oplogread: 'oplog read',
  blackbox: 'Blackbox',
  perfaccess: 'performance counter access'
};

function evEsc(s) {
  return String(s)
    .split('&').join('&amp;')
    .split('<').join('&lt;')
    .split('>').join('&gt;')
    .split('"').join('&quot;');
}

function evDepsOff() {
  if (!W.deps || typeof W.deps !== 'object') { W.deps = {}; }
  return W.deps;
}

function evDepFor(c) {
  var keys = EVDEP_MAP[c.id] || [];
  var o = evDepsOff();
  var i, k;
  for (i = 0; i < keys.length; i++) {
    k = keys[i];
    if (o[k] === true && EVDEP_DEFS[k].soft === false) {
      return { key: k, def: EVDEP_DEFS[k], forced: false, soft: false };
    }
  }
  if (c.verdict === 'none') {
    for (i = 0; i < keys.length; i++) {
      k = keys[i];
      if (EVDEP_DEFS[k].soft === false) {
        return { key: k, def: EVDEP_DEFS[k], forced: true, soft: false };
      }
    }
  }
  for (i = 0; i < keys.length; i++) {
    k = keys[i];
    if (o[k] === true && EVDEP_DEFS[k].soft === true) {
      return { key: k, def: EVDEP_DEFS[k], forced: false, soft: true };
    }
  }
  return null;
}

function evDepBlocked(c) {
  var keys = EVDEP_MAP[c.id] || [];
  var o = evDepsOff();
  var i;
  for (i = 0; i < keys.length; i++) {
    if (o[keys[i]] === true && EVDEP_DEFS[keys[i]].soft === false) { return true; }
  }
  return false;
}

function evDepEffVerdict(c) {
  return evDepBlocked(c) ? 'none' : c.verdict;
}

function evDepBanner(c) {
  var d = evDepFor(c);
  if (d === null) { return ''; }
  var def = d.def;
  var h = '<div class="ev-dep" role="note"><p class="ev-dep-title"><b>Could not check:</b> '
    + evEsc(def.title) + '</p><p class="ev-dep-why">' + evEsc(def.why)
    + '</p><p class="ev-dep-effect">' + evEsc(def.effect) + '</p>';
  if (def.fix && def.fix.length > 0) {
    var cmd = evEsc(def.fix.join('\n'));
    h += '<div class="ev-dep-fix"><p class="ev-dep-fixlabel">To turn it on, an administrator can run:</p><pre class="ev-cmd">'
      + cmd + '</pre><button type="button" class="ev-copy" onclick="evCopy(this)" data-copy="'
      + cmd + '">Copy command</button></div>';
  }
  h += '<p class="ev-dep-note">' + evEsc(def.note) + '</p></div>';
  return h;
}

function evDepToggle(key) {
  var o = evDepsOff();
  if (o[key]) { delete o[key]; } else { o[key] = true; }
  render();
}

function evDepToggles(group) {
  var o = evDepsOff();
  var h = '<div class="seg ev-dep-pick" role="group" aria-label="Pretend a source is missing">';
  var keys = Object.keys(EVDEP_DEFS);
  var i, k;
  for (i = 0; i < keys.length; i++) {
    k = keys[i];
    if (EVDEP_DEFS[k].group !== group) { continue; }
    h += '<button type="button" class="btn" aria-pressed="' + (o[k] ? 'true' : 'false')
      + '" onclick="evDepToggle(\'' + k + '\')">' + (o[k] ? 'Stop pretending: ' : 'Pretend off: ') + (EVDEP_NAMES[k] || k) + '</button>';
  }
  return h + '</div>';
}

function evCopy(btn) {
  var t = btn.getAttribute('data-copy') || '';
  var orig = btn.textContent;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t);
    } else {
      var ta = document.createElement('textarea');
      ta.value = t;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
  } catch (e) {}
  btn.textContent = 'Copied';
  setTimeout(function () { btn.textContent = orig; }, 1500);
}

</script>

<script>
function evEsc2(s) {
  var r = String(s == null ? '' : s);
  r = r.split('&').join('&amp;');
  r = r.split('<').join('&lt;');
  r = r.split('>').join('&gt;');
  r = r.split('"').join('&quot;');
  return r;
}

function evImpact(c) {
  if (typeof EVIMPACT === 'object' && EVIMPACT && typeof EVIMPACT[c.id] === 'string' && EVIMPACT[c.id]) {
    return '<p class="ev-impact"><b>In plain words:</b> ' + evEsc2(EVIMPACT[c.id]) + '</p>';
  }
  return '';
}

function evTip(c, text) {
  var terms = [];
  if (typeof EVHELP === 'object' && EVHELP && typeof EVHELP[c.id] === 'object' && EVHELP[c.id] && Array.isArray(EVHELP[c.id].terms)) {
    terms = EVHELP[c.id].terms;
  }
  var s = evEsc2(text);
  if (!terms.length) {
    return s;
  }
  var list = [];
  for (var i = 0; i < terms.length; i++) {
    if (terms[i] && typeof terms[i] === 'object' && typeof terms[i].t === 'string' && terms[i].t) {
      list.push(terms[i]);
    }
  }
  list.sort(function(a, b) { return b.t.length - a.t.length; });
  var marks = [];
  var re = /\u0001\d+\u0001/g;
  for (var j = 0; j < list.length; j++) {
    var t = list[j].t;
    var d = list[j].d;
    var et = evEsc2(t);
    if (!et) {
      continue;
    }
    var pos = 0;
    for (;;) {
      var idx = s.indexOf(et, pos);
      if (idx < 0) {
        break;
      }
      var before = idx > 0 ? s.charAt(idx - 1) : '';
      var after = idx + et.length < s.length ? s.charAt(idx + et.length) : '';
      var okB = !before || !/[A-Za-z0-9_]/.test(before);
      var okA = !after || !/[A-Za-z0-9_]/.test(after);
      var overlaps = false;
      re.lastIndex = 0;
      var m;
      while ((m = re.exec(s)) !== null) {
        if (idx < m.index + m[0].length && m.index < idx + et.length) {
          overlaps = true;
          break;
        }
      }
      if (okB && okA && !overlaps) {
        s = s.slice(0, idx) + '\u0001' + marks.length + '\u0001' + s.slice(idx + et.length);
        marks.push('<span class="ev-tt" tabindex="0" data-tip="' + evEsc2(t + ': ' + d) + '">' + evEsc2(t) + '</span>');
        break;
      }
      pos = idx + 1;
    }
  }
  for (var k = 0; k < marks.length; k++) {
    s = s.split('\u0001' + k + '\u0001').join(marks[k]);
  }
  return s;
}

function evQueryId(id) {
  return '<span class="ev-qa"><code>' + evEsc2(id) + '</code><button type="button" class="ev-copy" onclick="evCopy(this)" data-copy="' + evEsc2(id) + '">Copy query ID</button><span>Open the plan with showplan in SSMS or Azure Data Studio using this query ID.</span></span>';
}

</script>

<script>
// Query table for evidence cards that carry a per-query list (packet CPU).
// Globals used from elsewhere: evEsc2 and evQueryId (parts/12-evidence-h.js),
// EVDEP_MAP and EVDEP_DEFS (parts/14-deps-data.js), evDepsOff (parts/12-evidence-g.js).

function evQueryWaitsOn(c) {
  if (typeof EVDEP_MAP !== 'object' || !EVDEP_MAP || typeof EVDEP_DEFS !== 'object' || !EVDEP_DEFS || !EVDEP_DEFS.qswaits) { return false; }
  var keys = EVDEP_MAP[c.id] || [];
  var has = false;
  var i;
  for (i = 0; i < keys.length; i++) {
    if (keys[i] === 'qswaits') { has = true; }
  }
  if (!has) { return false; }
  var off = (typeof evDepsOff === 'function') ? evDepsOff() : null;
  return !(off && off.qswaits === true);
}

function evQueryTable(c) {
  if (!c || Object.prototype.toString.call(c.queries) !== '[object Array]') { return ''; }
  var waitOn = evQueryWaitsOn(c);
  var h = '<table class="wf"><caption>Top queries in the incident window</caption><thead><tr><th>Query ID</th><th>Calls</th><th>Avg ms</th><th>p95 ms</th>';
  if (waitOn) { h += '<th>Wait type</th>'; }
  h += '</tr></thead><tbody>';
  var i;
  for (i = 0; i < c.queries.length; i++) {
    var q = c.queries[i];
    h += '<tr><td>' + evQueryId(q.id) + '</td><td>' + evEsc2(q.calls) + '</td><td>' + evEsc2(q.avg) + '</td><td>' + evEsc2(q.p95) + '</td>';
    if (waitOn) { h += '<td>' + evEsc2(q.wait) + '</td>'; }
    h += '</tr>';
  }
  h += '</tbody></table>';
  if (!waitOn) {
    h += '<p class="note">Per-query wait types require SQL Server 2017+ with Query Store wait stats enabled.</p>';
  }
  return h;
}

</script>

<script>
function evWhy(id) {
  W.why = id;
  render();

    + '<button class="btn" aria-label="Back to the case" onclick="inert(\'Back to the case: returns to the case page and keeps the chosen step for next time\')">&larr; Case 0042</button>'
    + '<div class="crumb"><small>Case 0042 &middot; Orders slowdown 26 Oct' + (W.mode === 'manual' ? ' &middot; You are using Manual tools.' : ' &middot; You are using Guided analysis.') + '</small>'
    + '<h2>' + (guided ? 'Guided analysis' : 'Manual tools') + '</h2></div>'
    + '<button class="btn sm" onclick="setMode(\'' + (guided ? 'manual' : 'guided') + '\')">' + (guided ? 'Switch to Manual tools' : 'Switch to Guided analysis') + '</button></div>';
}
function runBar(){
  var primary = !(W.mode === 'guided' && W.step === 11);

    + (W.stepState[3] === 'Out of date' ? '<span class="stale">The windows, sources or lists changed after this ran.</span>' : '')

// ---------- step frame (StepShell look) ----------

function nutshell(text){

function prevNext(){

// ---------- guided variants ----------
function railHtml(){
  var last = '', out = '';

function renderA(){

function renderB(){

      var tone = stepState(s.n); var dot = tone === 'Out of date' ? 'partly' : (ST_TONE[tone] === 'waiting' ? '' : ST_TONE[tone]);

  }).join('');
  return '<div class="work B">' + caseBar() + '<div class="stepper" role="navigation" aria-label="Steps">' + bar + '</div>'

function renderC(){
  var done = STEPS.filter(function(s){ return stepState(s.n) === 'Ready'; }).length;
  var prog = '<nav class="prog" aria-label="Progress"><div class="note">' + done + ' of ' + STEPS.length + ' answered</div><div class="meter"><div style="width:' + Math.round(done / STEPS.length * 100) + '%"></div></div>'
    + STEPS.map(function(s){ return '<button class="' + (s.n === W.openFold ? 'cur' : '') + '" onclick="fold(' + s.n + ')">' + s.n + '. ' + s.label + '</button>'; }).join('') + '</nav>';
  var folds = STEPS.map(function(s){
    return '<section class="fold' + (s.n === W.openFold ? ' cur' : '') + '"><button onclick="fold(' + s.n + ')" aria-expanded="' + (s.n === W.openFold) + '"><span class="n">' + s.n + '</span><span>' + s.title + '</span><span class="sp"></span>' + stepSticker(s.n) + '</button>'
      + (s.n === W.openFold ? '<div class="inner">' + stepWrap(s.n) + '</div>' : '') + '</section>';

  return '<div class="work C">' + caseBar() + '<div class="body">' + prog + '<main class="pane" id="pane" tabindex="0">' + runBar() + flashLine() + folds + '</main></div></div>';

// one step page: shell + body for the current state + notes strip
function stepWrap(n){
  var st = stepState(n);
  var body = (typeof window['step' + n] === 'function') ? window['step' + n](st) : '<p class="note">No renderer.</p>';
  return '<div class="stepbody">' + stepHead(n) + body + wfn('step' + n, window['stepNotes' + n] ? window['stepNotes' + n]() : '', null) + '</div>';
}

// ---------- navigation and mode ----------
function keepScroll(){
  var pane = document.getElementById('pane') || document.getElementById('mpane');
  var top = pane ? pane.scrollTop : 0;
  document.getElementById('app').innerHTML = topHeader() + (W.mode === 'guided'
    ? (W.variant === 'A' ? renderA() : W.variant === 'B' ? renderB() : renderC())
    : renderManual());
  var p2 = document.getElementById('pane') || document.getElementById('mpane');
  if (p2 && top) p2.scrollTop = top;
}
function render(){
  keepScroll();
  document.getElementById('vlabel').innerHTML = W.variant + ' <small>' + ({ A:'Fixed rail', B:'Top stepper', C:'One flow' })[W.variant] + '</small>';
  try {
    var q = '?variant=' + W.variant + '&mode=' + W.mode + (W.mode === 'guided' ? '&step=' + W.step : (W.tool ? '&tool=' + W.tool : ''));
    history.replaceState(null, '', q);
  } catch (e) {}
}
function go(n){ W.step = n; W.openFold = n; W.flash = ''; render(); var p = document.getElementById('pane'); if (p) p.scrollTop = 0; }
function fold(n){ W.openFold = n; W.step = n; render(); }
function setMode(m){ W.mode = m; W.flash = ''; render(); var p = document.getElementById('pane') || document.getElementById('mpane'); if (p) p.scrollTop = 0; }
function cycle(d){ var k = ['A','B','C']; W.variant = k[(k.indexOf(W.variant) + d + 3) % 3]; render(); }
function toggleTheme(){ var r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark'; }

// ---------- keyboard ----------
document.getElementById('prev').onclick = function(){ cycle(-1); };
document.getElementById('next').onclick = function(){ cycle(1); };
addEventListener('keydown', function(e){
  var tag = document.activeElement && document.activeElement.tagName;
  if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;
  if (e.key === 'ArrowLeft' && !e.target.closest('.rail')) cycle(-1);
  else if (e.key === 'ArrowRight' && !e.target.closest('.rail')) cycle(1);
  else if (e.key === 't' || e.key === 'T') toggleTheme();
});
// rail arrow keys: Up/Down/Home/End move between rows, Enter selects (native button)
addEventListener('keydown', function(e){
  var row = e.target.closest && e.target.closest('.rail .row');
  if (!row) return;
  var rows = Array.prototype.slice.call(document.querySelectorAll('.rail .row'));
  var i = rows.indexOf(row), j = -1;
  if (e.key === 'ArrowDown') j = i + 1; else if (e.key === 'ArrowUp') j = i - 1;
  else if (e.key === 'Home') j = 0; else if (e.key === 'End') j = rows.length - 1;
  if (j < 0 || j >= rows.length) return;
  e.preventDefault(); rows[j].focus();
});
// remember which notes strips are open
addEventListener('toggle', function(e){
  var d = e.target;
  if (d && d.classList && d.classList.contains('wfn')) W.notesOpen[d.getAttribute('data-wfn')] = d.open;
}, true);

<script>
// Step 0 helpers: time formatting, window-sanity banner, release lines, estimate line, DST notice.
var FP_MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function fpMs(s) {
  return Date.parse(String(s || '') + 'Z');
}

function fpIso(ms) {
  return new Date(ms).toISOString().slice(0, 16);
}

function fpPad(n) {
  return n < 10 ? '0' + n : '' + n;
}

function fpWhen(ms) {
  var d = new Date(ms);
  return d.getUTCDate() + ' ' + FP_MON[d.getUTCMonth()] + ' ' + fpPad(d.getUTCHours()) + ':' + fpPad(d.getUTCMinutes()) + ' UTC';
}

function fpDate(ms) {
  var d = new Date(ms);
  return d.getUTCDate() + ' ' + FP_MON[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
}

function fpDur(ms) {
  var m = Math.round(ms / 60000);
  var n;
  if (m >= 1440 && m % 1440 === 0) {
    n = m / 1440;
    return n + ' day' + (n === 1 ? '' : 's');
  }
  if (m >= 60 && m % 60 === 0) {
    n = m / 60;
    return n + ' hour' + (n === 1 ? '' : 's');
  }
  if (m < 60) {
    return m + ' minute' + (m === 1 ? '' : 's');
  }
  var h = Math.floor(m / 60);
  var mm = m % 60;
  return h + ' h ' + mm + ' min';
}

function fpShort(ms) {
  var m = Math.round(ms / 60000);
  var n;
  if (m >= 1440 && m % 1440 === 0) {
    n = m / 1440;
    return n + 'd';
  }
  if (m >= 60 && m % 60 === 0) {
    n = m / 60;
    return n + 'h';
  }
  if (m < 60) {
    return m + 'm';
  }
  var h = Math.floor(m / 60);
  var mm = m % 60;
  return h + 'h ' + mm + 'm';
}

function fpKey(kind) {
  return kind + '|' + W.frame.incidentStart + '|' + W.frame.incidentEnd + '|' + W.frame.referenceStart + '|' + W.frame.referenceEnd;
}

function frameBannerKind() {
  var f = W.frame;
  var a = fpMs(f.incidentStart);
  var b = fpMs(f.incidentEnd);
  var c = fpMs(f.referenceStart);
  var d = fpMs(f.referenceEnd);
  if (isNaN(a) || isNaN(b) || isNaN(c) || isNaN(d) || b <= a || d <= c) {
    return '';
  }
  if (c < b && a < d) {
    return 'overlap';
  }
  if (d === a) {
    return 'touching';
  }
  if ((d - c) > 2 * (b - a) || (b - a) > 2 * (d - c)) {
    return 'ratio';
  }
  return '';
}

function frameKeepTouching() {
  W.frameKeep = fpKey('touching');
}

function frameBanner() {
  var kind = frameBannerKind();
  if (kind === '') {
    return '';
  }
  if (typeof W.frameKeep !== 'string') {
    W.frameKeep = fpKey('touching');
  }
  if (W.frameKeep === fpKey(kind)) {
    return '';
  }
  var f = W.frame;
  var a = fpMs(f.incidentStart);
  var b = fpMs(f.incidentEnd);
  var c = fpMs(f.referenceStart);
  var d = fpMs(f.referenceEnd);
  var fix, label, text;
  if (kind === 'overlap') {
    fix = 'move';
    label = 'Move reference before the incident';
    text = 'The reference window overlaps the incident window by ' + fpDur(Math.min(b, d) - Math.max(a, c)) + '. Comparing against a period that includes the problem is not a fair baseline.';
  } else if (kind === 'touching') {
    fix = 'gap';
    label = 'Add a 5-minute gap';
    text = 'The reference window ends the instant the incident starts, with no gap between them. Calls right at the boundary may fall in either window.';
  } else {
    fix = 'match';
    label = 'Match the incident window length';
    var li = b - a;
    var lr = d - c;
    var ratio, r;
    if (lr > li) {
      ratio = lr / li;
      r = (ratio === Math.round(ratio)) ? String(Math.round(ratio)) : ratio.toFixed(1);
      text = 'The reference window is ' + r + '&times; the length of the incident window (' + fpShort(lr) + ' vs ' + fpShort(li) + '). Rates are compared per minute, but very different lengths make rare events harder to compare fairly.';
    } else {
      ratio = li / lr;
      r = (ratio === Math.round(ratio)) ? String(Math.round(ratio)) : ratio.toFixed(1);
      text = 'The incident window is ' + r + '&times; the length of the reference window (' + fpShort(li) + ' vs ' + fpShort(lr) + '). Rates are compared per minute, but very different lengths make rare events harder to compare fairly.';
    }
  }
  return '<div class="notice" role="status"><p>' + text + '</p><div class="row"><button class="btn sm" onclick="frameFix(\'' + fix + '\')">' + label + '</button><button class="btn sm" onclick="frameFix(\'keep\')">Keep anyway</button></div></div>';
}

function frameFix(kind) {
  var f = W.frame;
  var a = fpMs(f.incidentStart);
  var b = fpMs(f.incidentEnd);
  var c = fpMs(f.referenceStart);
  var d = fpMs(f.referenceEnd);
  if (isNaN(a) || isNaN(b) || isNaN(c) || isNaN(d)) {
    render();
    return;
  }
  var li = b - a;
  var lr = d - c;
  if (kind === 'keep') {
    W.frameKeep = fpKey(frameBannerKind());
  } else if (kind === 'move') {
    var e = a - 300000;
    f.referenceEnd = fpIso(e);
    f.referenceStart = fpIso(e - lr);
  } else if (kind === 'gap') {
    f.referenceStart = fpIso(c - 300000);
    f.referenceEnd = fpIso(d - 300000);
  } else if (kind === 'match') {
    f.referenceStart = fpIso(d - li);
  }
  render();
}

function frameReleaseHint() {
  if (W.frame.releases.length === 0) {
    return '<p class="note">If you know of a deploy, flag flip or config change near the start of the slowdown, add it here. Unravis does not assume one happened.</p>';
  }
  return '';
}

function frameReleaseLine(r) {
  var t = fpMs(r.at);
  var a = fpMs(W.frame.incidentStart);
  var b = fpMs(W.frame.incidentEnd);
  if (!(t >= a && t <= b)) {
    return '';
  }
  return '<p class="note" role="status">This change is inside the incident window (' + fpWhen(t) + '). It may be the cause rather than just a marker &mdash; Step 5 will line it up against the onset.</p>';
}

function frameEstimateLine() {
  var f = W.frame;
  var a = fpMs(f.incidentStart);
  var b = fpMs(f.incidentEnd);
  var c = fpMs(f.referenceStart);
  var d = fpMs(f.referenceEnd);
  if (isNaN(a) || isNaN(b) || isNaN(c) || isNaN(d) || b <= a || d <= c) {
    return '';
  }
  var n = (typeof W.srcCount === 'number' && W.srcCount > 0) ? W.srcCount : 2;
  var mins = ((b - a) + (d - c)) / 60000;
  var rows = Math.round(mins * 20 * n);
  var rowsText;
  if (rows < 1000) {
    rowsText = String(rows);
  } else if (rows < 1000000) {
    var p = Math.pow(10, String(rows).length - 3);
    var r = Math.round(rows / p) * p;
    rowsText = String(r).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  } else {
    rowsText = (Math.floor(rows / 100000) / 10).toFixed(1) + 'M';
  }
  var timeText;
  if (rows < 10000) {
    timeText = '3 s';
  } else if (rows < 200000) {
    timeText = '20 s';
  } else if (rows < 1000000) {
    timeText = '1 min';
  } else {
    timeText = '4 min';
  }
  var long = (b - a) > 86400000 || (d - c) > 86400000;
  return '<p class="note" role="status">This reads &asymp; ' + rowsText + ' calls from ' + n + ' source' + (n === 1 ? '' : 's') + ' and takes about ' + timeText + '.' + (long ? ' Shown as hourly averages &mdash; see below.' : '') + '</p>';
}

function fpNthSunday(y, m, n) {
  var first = new Date(Date.UTC(y, m, 1)).getUTCDay();
  return Date.UTC(y, m, 1 + ((7 - first) % 7) + (n - 1) * 7);
}

function fpLastSunday(y, m) {
  var last = new Date(Date.UTC(y, m + 1, 0));
  return Date.UTC(y, m, last.getUTCDate() - last.getUTCDay());
}

function frameDst() {
  var f = W.frame;
  var vals = [fpMs(f.incidentStart), fpMs(f.incidentEnd), fpMs(f.referenceStart), fpMs(f.referenceEnd)];
  var valid = [];
  var i;
  for (i = 0; i < vals.length; i++) {
    if (!isNaN(vals[i])) {
      valid.push(vals[i]);
    }
  }
  if (valid.length === 0) {
    return '';
  }
  var lo = valid[0], hi = valid[0];
  for (i = 1; i < valid.length; i++) {
    if (valid[i] < lo) { lo = valid[i]; }
    if (valid[i] > hi) { hi = valid[i]; }
  }
  var y0 = new Date(lo).getUTCFullYear();
  var y1 = new Date(hi).getUTCFullYear();
  var dates = [];
  for (var y = y0; y <= y1; y++) {
    dates.push(fpNthSunday(y, 2, 2));
    dates.push(fpNthSunday(y, 10, 1));
    dates.push(fpLastSunday(y, 2));
    dates.push(fpLastSunday(y, 9));
  }
  dates.sort(function (x, z) { return x - z; });
  for (i = 0; i < dates.length; i++) {
    var d = dates[i];
    if (d < hi && d + 86400000 > lo) {
      return '<p class="note" role="status">This window crosses a daylight-saving change on ' + fpDate(d) + '. All times above stay in UTC; the same UTC time may map to a different local clock time before and after this date.</p>';
    }
  }
  return '';
}

</script>

<script>
var SLOW_PAGE = 25;
function slowPageRows(rows){
  var n = rows.length;
  var pages = Math.max(1, Math.ceil(n / SLOW_PAGE));
  W.slowPg = Math.min(Math.max(0, W.slowPg || 0), pages - 1);
  return rows.slice(W.slowPg * SLOW_PAGE, W.slowPg * SLOW_PAGE + SLOW_PAGE);
}
function slowPager(total){
  if (total < 1) return '';
  var pages = Math.max(1, Math.ceil(total / SLOW_PAGE));
  var pg = Math.min(Math.max(0, W.slowPg || 0), pages - 1);
  var a = pg * SLOW_PAGE + 1;
  var b = Math.min(total, a + SLOW_PAGE - 1);
  return '<div class="pager" role="navigation" aria-label="Slow calls pages"><span class="note" role="status">Showing ' + a + ' to ' + b + ' of ' + total + '.</span><button class="btn sm" onclick="slowPageGo(-1)"' + (pg === 0 ? ' disabled' : '') + '>Previous</button><button class="btn sm" onclick="slowPageGo(1)"' + (pg >= pages - 1 ? ' disabled' : '') + '>Next</button></div>';
}
function slowPageGo(d){
  W.slowPg = (W.slowPg || 0) + d;
  render();
}
function fpRollupAny(){
  if (typeof fpMs !== 'function') return '';
  var f = W.frame;
  var li = fpMs(f.incidentEnd) - fpMs(f.incidentStart);
  var lr = fpMs(f.referenceEnd) - fpMs(f.referenceStart);
  if (li > 86400000 || lr > 86400000) return '<p class="note" role="status">Showing hourly averages because the window is longer than 24 hours. Spikes shorter than an hour may not show as a peak at this scale.</p>';
  return '';
}

</script>

<script>
function recurInit() {
  if (typeof W.recur !== 'object' || W.recur === null) {
    W.recur = { mode: 'one', st: '09:00', en: '10:00', n: 6, wd: 4 };
  }
  return W.recur;
}

var RECUR_WD = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

function recurSet(key, val) {
  var r = recurInit();
  if (key === 'n') {
    var n = parseInt(val, 10);
    if (isNaN(n)) n = 1;
    var max = recurLimit(r.mode);
    if (n < 1) n = 1;
    if (n > max) n = max;
    r.n = n;
  } else if (key === 'wd') {
    var wd = parseInt(val, 10);
    r.wd = isNaN(wd) ? 4 : wd;
  } else {
    r[key] = String(val);
  }
  render();
}

function recurMode(m) {
  recurInit().mode = m;
  render();
}

function recurUnit(mode, n) {
  if (mode === 'days') return n === 1 ? 'day' : 'days';
  if (mode === 'weeks') return n === 1 ? 'week' : 'weeks';
  if (mode === 'month') return n === 1 ? 'month' : 'months';
  return '';
}

function recurLimit(mode) {
  if (mode === 'days') return 30;
  if (mode === 'weeks') return 26;
  if (mode === 'month') return 24;
  return 1;
}

function recurOcc() {
  var r = recurInit();
  var timeRe = /^([01]\d|2[0-3]):[0-5]\d$/;
  if (!timeRe.test(r.st) || !timeRe.test(r.en)) {
    return { ok: false, msg: 'Enter the start and end as HH:MM.' };
  }
  var stMin = parseInt(r.st.slice(0, 2), 10) * 60 + parseInt(r.st.slice(3, 5), 10);
  var enMin = parseInt(r.en.slice(0, 2), 10) * 60 + parseInt(r.en.slice(3, 5), 10);
  if (!(enMin > stMin)) {
    return { ok: false, msg: 'The end time must be after the start time.' };
  }
  var a = fpMs(W.frame.incidentStart);
  if (isNaN(a)) {
    return { ok: false, msg: 'Set the incident window first.' };
  }
  var day0 = Math.floor(a / 86400000) * 86400000;
  var max = recurLimit(r.mode);
  var n = r.n;
  if (n < 1) n = 1;
  if (n > max) n = max;
  var list = [];
  var k;
  if (r.mode === 'days') {
    for (k = 1; k <= n; k++) {
      list.push(day0 - k * 86400000);
    }
  } else if (r.mode === 'weeks') {
    var d = day0 - 86400000;
    while (new Date(d).getUTCDay() !== r.wd) {
      d -= 86400000;
    }
    var first = d;
    for (k = 1; k <= n; k++) {
      list.push(first - (k - 1) * 7 * 86400000);
    }
  } else if (r.mode === 'month') {
    var base = new Date(day0);
    var y = base.getUTCFullYear();
    var m = base.getUTCMonth();
    for (k = 1; k <= n; k++) {
      var norm = new Date(Date.UTC(y, m - k, 1));
      var ny = norm.getUTCFullYear();
      var nm = norm.getUTCMonth();
      var last = new Date(Date.UTC(ny, nm + 1, 0));
      var dl = last.getUTCDate();
      var wl = last.getUTCDay();
      var day = dl - ((wl - 4 + 7) % 7);
      list.push(Date.UTC(ny, nm, day));
    }
  }
  return {
    ok: true,
    list: list,
    n: n,
    unit: recurUnit(r.mode, n),
    mode: r.mode,
    st: r.st,
    en: r.en
  };
}

function recurSummary(o) {
  var oldest = o.list[0];
  var newest = o.list[0];
  for (var i = 0; i < o.list.length; i++) {
    if (o.list[i] < oldest) oldest = o.list[i];
    if (o.list[i] > newest) newest = o.list[i];
  }
  var desc;
  if (o.mode === 'days') {
    desc = 'each of the previous days';
  } else if (o.mode === 'weeks') {
    var r = recurInit();
    desc = 'the same weekday (' + RECUR_WD[r.wd] + ') on previous weeks';
  } else if (o.mode === 'month') {
    desc = 'the last Thursday of the month';
  }
  return '<p class="note" role="status">Comparing ' + o.st + '&ndash;' + o.en + ' UTC on ' + desc + ', for ' + o.n + ' ' + o.unit + ' (' + fpDate(oldest) + ' to ' + fpDate(newest) + ').</p>';
}

function recurHeat(o) {
  var rows = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  var cols = [];
  var c;
  for (c = 0; c < 24; c++) {
    cols.push(fpPad(c));
  }
  var cells = [];
  var r;
  for (r = 0; r < 7; r++) {
    for (c = 0; c < 24; c++) {
      var v = 80 + (c >= 8 && c <= 18 ? 120 : 0) + r * 6 + ((r * 31 + c * 17) % 40);
      if (r === 3 && c === 9) v += 260;
      if (r >= 5 && c < 6) v = null;
      cells.push({ r: r, c: c, v: v, tip: 'p95 latency, ms' });
    }
  }
  var html = heatmap(cells, cols, rows);

  var sh = parseInt(o.st.slice(0, 2), 10);
  var eh = parseInt(o.en.slice(0, 2), 10);
  var enMinPart = parseInt(o.en.slice(3, 5), 10);
  var lastH = enMinPart === 0 ? eh - 1 : eh;

  var r2 = recurInit();
  var matchWd = o.mode === 'month' ? 4 : r2.wd;

  var hitIdx = {};
  for (r = 0; r < 7; r++) {
    var rowMatches = o.mode === 'days' ? true : ((r + 1) % 7 === matchWd);
    if (!rowMatches) continue;
    for (c = 0; c < 24; c++) {
      if (c >= sh && c <= lastH) {
        hitIdx[r * 24 + c + 1] = true;
      }
    }
  }

  var parts = html.split('<rect class="cell ');
  var normalDelim = '<rect class="cell ';
  var hitDelim = '<rect class="cell hit' + (o.mode === 'month' ? ' dash' : '') + ' ';
  var out = parts[0];
  for (var pi = 1; pi < parts.length; pi++) {
    out += (hitIdx[pi] ? hitDelim : normalDelim) + parts[pi];
  }
  html = out;
  return html
    + '<p class="note">Darker red = slower than normal for that hour. Light = close to normal. Gray = no data yet for that hour.</p>'
    + '<p class="note">' + (o.mode === 'month' ? 'Dashed border: the hours the rule matches, on only one such weekday a month (the last).' : 'Outlined cells: the hours the rule matches.') + '</p>';
}

function recurOverlay(o) {
  var shown = o.list.length < 8 ? o.list.length : 8;
  var list = o.list.slice(0, shown);
  var stMin = parseInt(o.st.slice(0, 2), 10) * 60 + parseInt(o.st.slice(3, 5), 10);
  var enMin = parseInt(o.en.slice(0, 2), 10) * 60 + parseInt(o.en.slice(3, 5), 10);
  var L = enMin - stMin;

  var html = '<svg role="img" aria-label="Overlay of ' + shown + ' occurrences, aligned to the window start" viewBox="0 0 640 140" class="recur-ov">';
  var k, i;
  for (k = 0; k < shown; k++) {
    var pts = '';
    for (i = 0; i <= 12; i++) {
      var x = Math.round((600 / 12) * i);
      var y = 110 - ((k * 37 + i * 17) % 23) * 3 - (k === 0 ? 14 : 0);
      pts += (i === 0 ? '' : ' ') + x + ',' + y;
    }
    html += '<polyline class="' + (k === 0 ? 'recur-line now' : 'recur-line') + '" points="' + pts + '"></polyline>';
  }
  html += '<text class="axis-label" x="0" y="136">0</text>';
  html += '<text class="axis-label" x="600" y="136" text-anchor="end">' + L + ' min</text>';
  html += '</svg>';
  html += '<p class="note">One line per occurrence, aligned so each starts at 0. The darkest line is the most recent.</p>';
  if (o.list.length > 8) {
    html += '<p class="note">Showing the most recent 8 of ' + o.list.length + ' occurrences; all ' + o.list.length + ' appear in the heatmap.</p>';
  }
  html += '<details class="ev-fold"><summary>Occurrence dates</summary><ul>';
  for (i = 0; i < o.list.length; i++) {
    html += '<li>' + fpDate(o.list[i]) + '</li>';
  }
  html += '</ul></details>';
  return html;
}

function frameRecurrence() {
  var r = recurInit();
  var html = '<fieldset class="wf recur"><legend>Compare with a repeating pattern (optional)</legend>';
  html += '<div role="radiogroup" aria-label="Repeat pattern">';

  var modes = [
    ['one', 'One window'],
    ['days', 'Same hours on the previous days'],
    ['weeks', 'Same weekday on previous weeks'],
    ['month', 'Last Thursday of every month']
  ];
  var i;
  for (i = 0; i < modes.length; i++) {
    var mv = modes[i][0];
    var mt = modes[i][1];
    html += '<label class="wf"><input type="radio" name="recur-mode" value="' + mv + '"' + (r.mode === mv ? ' checked' : '') + ' onchange="recurMode(\'' + mv + '\')"> ' + mt + '</label>';
  }
  html += '</div>';

  if (r.mode === 'one') {
    html += '<p class="note">The reference window above is used as it is.</p>';
    html += '</fieldset>';
    return html;
  }

  html += '<div class="pair">';
  html += '<label class="wf">Start (UTC)<input class="wf" type="time" value="' + r.st + '" onchange="recurSet(\'st\', this.value)"></label>';
  html += '<label class="wf">End (UTC)<input class="wf" type="time" value="' + r.en + '" onchange="recurSet(\'en\', this.value)"></label>';
  if (r.mode === 'weeks') {
    html += '<label class="wf">Weekday<select class="wf" onchange="recurSet(\'wd\', this.value)">';
    for (i = 0; i < RECUR_WD.length; i++) {
      html += '<option value="' + i + '"' + (r.wd === i ? ' selected' : '') + '>' + RECUR_WD[i] + '</option>';
    }
    html += '</select></label>';
  }
  var max = recurLimit(r.mode);
  var unitPlural = recurUnit(r.mode, 2);
  html += '<label class="wf">How many ' + unitPlural + ' back<input class="wf" type="number" min="1" max="' + max + '" value="' + r.n + '" onchange="recurSet(\'n\', this.value)"></label>';
  html += '</div>';

  var o = recurOcc();
  if (!o.ok) {
    html += '<p class="note" role="alert">' + o.msg + '</p>';
  } else {
    html += recurSummary(o) + recurHeat(o) + recurOverlay(o);
  }

  html += '</fieldset>';
  return html;
}

</script>

<script>
// ---------- steps 0 to 4 ----------
function signed(n){ n = String(n); return n.charAt(0) === '-' ? n : '+' + n; }
function statePrefix(n, st){
  if (st === 'Waiting') return '<p class="note">This step shows the last run. Run the steps first to fill it in.</p>';
  if (st === 'Failed') return '<div class="err" role="alert"><b>The steps could not run.</b><span>The audit source could not be read.</span><span><b>Next:</b> check the source and run again.</span><div><button class="btn sm" onclick="W.stepState[' + n + ']=\'Ready\';render()">Retry reading</button></div></div>';
  if (st === 'Out of date') return '<p class="notice" role="status">The windows, sources or lists changed after this ran. The numbers below are from the earlier run.</p>';
  return '';
}
function cannotBody(n, rows, cta){
  return '<p class="note">This step could not test what it reads. Nothing is shown rather than a guess.</p>' + reasonsBox(rows)
    + (cta ? '<div class="row"><button class="btn sm" onclick="inert(\'Opens the case\\\'s Add data flow\')">' + cta + '</button></div>' : '');
}

// ----- Step 0: Frame the question (always a form; states change the frame around it) -----
function frameProblems(){
  var f = W.frame, out = [];
